# Publica en GitHub Pages los dos juegos del repositorio cada vez que cambian en main:
#   game/       en la raíz:          https://dbravogo-gif.github.io/Juegos-apps-claude/
#   aerolinea/  en /aerolinea/:      https://dbravogo-gif.github.io/Juegos-apps-claude/aerolinea/
# Un repositorio solo tiene un sitio de Pages, así que se publican juntos. Antes pasan los
# tests de los dos: si fallan, no se despliega.
name: Publicar juegos

on:
  push:
    branches: [main]
    paths: ['game/**', 'aerolinea/**', '.github/workflows/publicar-juego.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests del juego
        working-directory: game
        run: npm test
      - name: Tests de App viación
        working-directory: aerolinea
        run: npm test
      - name: Montar el sitio
        run: |
          mkdir web
          cp -r game/. web/
          mkdir web/aerolinea
          cp -r aerolinea/index.html aerolinea/manifest.webmanifest aerolinea/icon.svg aerolinea/src aerolinea/vendor aerolinea/img web/aerolinea/
          # Una página por comandante (aerolinea/piloto/<id>/), con su icono para la pantalla de inicio.
          node aerolinea/tools/paginas-pilotos.mjs web/aerolinea
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
