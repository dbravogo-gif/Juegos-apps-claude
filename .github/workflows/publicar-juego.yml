# Publica en GitHub Pages los juegos del repositorio cada vez que cambian en main:
#   game/                en la raíz:                https://dbravogo-gif.github.io/Juegos-apps-claude/
#   aerolinea/           en /aerolinea/:            https://dbravogo-gif.github.io/Juegos-apps-claude/aerolinea/
#   leyendas-de-iberia/  en /leyendas-de-iberia/:   https://dbravogo-gif.github.io/Juegos-apps-claude/leyendas-de-iberia/
#   gymlog-fase1/        en /gymlog-fase1/:         https://dbravogo-gif.github.io/Juegos-apps-claude/gymlog-fase1/
#   six-seven-islands/   en /six-seven-islands/:    https://dbravogo-gif.github.io/Juegos-apps-claude/six-seven-islands/
#   beep-run-club/       en /beep-run-club/:        https://dbravogo-gif.github.io/Juegos-apps-claude/beep-run-club/
# Un repositorio solo tiene un sitio de Pages, así que se publican juntos. Antes pasan los
# tests de todos: si fallan, no se despliega.
name: Publicar juegos

on:
  push:
    branches: [main]
    paths: ['game/**', 'aerolinea/**', 'leyendas-de-iberia/**', 'gymlog-fase1/**', 'six-seven-islands/**', 'beep-run-club/**', '.github/workflows/publicar-juego.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url || steps.despliegue2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests del juego
        working-directory: game
        run: npm test
      - name: Tests de App viación
        working-directory: aerolinea
        run: npm test
      - name: Tests y build de Leyendas de Iberia
        working-directory: leyendas-de-iberia
        run: |
          npm ci
          npm test
          npm run build
      - name: Tests y build de Six-seven islands
        working-directory: six-seven-islands
        run: |
          npm ci
          npm test
          npm run build
      - name: Tests de Beep Run Club
        working-directory: beep-run-club
        run: npm test
      - name: Montar el sitio
        run: |
          mkdir web
          cp -r game/. web/
          mkdir web/aerolinea
          cp -r aerolinea/index.html aerolinea/manifest.webmanifest aerolinea/icon.svg aerolinea/src aerolinea/vendor aerolinea/img web/aerolinea/
          # Una página por comandante (aerolinea/piloto/<id>/), con su icono para la pantalla de inicio.
          node aerolinea/tools/paginas-pilotos.mjs web/aerolinea
          mkdir web/leyendas-de-iberia
          cp -r leyendas-de-iberia/dist/. web/leyendas-de-iberia/
          # App estática (sin build): se copia tal cual.
          mkdir web/gymlog-fase1
          cp -r gymlog-fase1/. web/gymlog-fase1/
          mkdir web/six-seven-islands
          cp -r six-seven-islands/dist/. web/six-seven-islands/
          # App estática (sin build): solo lo que se sirve, sin pruebas ni documentos.
          mkdir web/beep-run-club
          cp -r beep-run-club/index.html beep-run-club/manifest.webmanifest beep-run-club/sw.js beep-run-club/entrenador beep-run-club/src beep-run-club/vendor beep-run-club/fuentes beep-run-club/img beep-run-club/icons web/beep-run-club/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # A veces GitHub aún no tiene registrado el paquete recién subido y el despliegue falla con
      # «No artifacts named github-pages» (cuatro veces el 2026-11-25 y 26, con las pruebas en verde).
      # Se espera un poco antes y, si falla, se reintenta una vez más tarde (autor, 2026-11-26).
      - name: Esperar a que GitHub registre el paquete
        run: sleep 20
      - id: despliegue
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Esperar antes de reintentar
        if: steps.despliegue.outcome == 'failure'
        run: sleep 60
      - id: despliegue2
        if: steps.despliegue.outcome == 'failure'
        uses: actions/deploy-pages@v4
