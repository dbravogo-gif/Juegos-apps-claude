# Publica App viación (carpeta aerolinea/) en GitHub Pages cada vez que cambia main.
name: Publicar App viación
on:
  push:
    branches: [main]
    paths: ['aerolinea/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web (sin pruebas ni herramientas)
        run: |
          mkdir web
          cp -r aerolinea/index.html aerolinea/manifest.webmanifest aerolinea/icon.svg aerolinea/src aerolinea/vendor aerolinea/img web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
