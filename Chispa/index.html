<!DOCTYPE html>
<html lang="es">
<head>
<title>Chispa</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)">
<meta name="description" content="Sesiones cortas para aprender venta consultiva y curiosidades en lugar de hacer scroll.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chispa">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: una columna de fichas (máx. 560px) sobre un banco de medición; pestañas abajo, acciones de tarjeta en un dock fijo. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E3E8ED; --line:#D0D8E0; --tick:rgba(19,27,36,.22);
  --ink:#131B24; --muted:#5B6776;
  --laser:#CF3B16; --laser-ink:#FFFFFF; --laser-soft:#FBE3DA;
  --cur:#0B7D70; --cur-soft:#D4EEE9;
  --gold:#9A6C05; --gold-soft:#F6E8C6;
  --good:#167A46; --good-soft:#DAF0E2;
  --bad:#B8234A; --bad-soft:#F7DBE3;
  --meh:#A15C00; --meh-soft:#F8E6CC;
  --shadow:0 1px 2px rgba(19,27,36,.06), 0 10px 28px rgba(19,27,36,.07);
  --glass:rgba(237,240,243,.86);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --surface:#161D24; --surface-2:#1F2830; --line:#2B3641; --tick:rgba(231,236,241,.22);
    --ink:#E7ECF1; --muted:#97A3B0;
    --laser:#FF6A45; --laser-ink:#1B0D08; --laser-soft:#3A1D15;
    --cur:#3CC6B4; --cur-soft:#11302B;
    --gold:#E8B947; --gold-soft:#372B0F;
    --good:#45CF83; --good-soft:#12301F;
    --bad:#FF6B8B; --bad-soft:#3A1620;
    --meh:#F2A541; --meh-soft:#3A2810;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
    --glass:rgba(14,19,24,.86);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#161D24; --surface-2:#1F2830; --line:#2B3641; --tick:rgba(231,236,241,.22);
  --ink:#E7ECF1; --muted:#97A3B0;
  --laser:#FF6A45; --laser-ink:#1B0D08; --laser-soft:#3A1D15;
  --cur:#3CC6B4; --cur-soft:#11302B;
  --gold:#E8B947; --gold-soft:#372B0F;
  --good:#45CF83; --good-soft:#12301F;
  --bad:#FF6B8B; --bad-soft:#3A1620;
  --meh:#F2A541; --meh-soft:#3A2810;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
  --glass:rgba(14,19,24,.86);
  color-scheme:dark;
}
html.embedded{--sat:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--laser);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.center{text-align:center}
.eyebrow,.lbl{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lbl{display:block;margin-bottom:6px}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + var(--sat)) calc(104px + env(safe-area-inset-bottom,0px))}
body.playing #app{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:16.5px;letter-spacing:-.005em;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--laser);color:var(--laser-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.btn.grow{flex:1}
.btn.sq{width:52px;padding:0;flex:none}
.btn svg{width:22px;height:22px}
.link{color:var(--laser);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Cabecera de inicio */
.hometop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.wordmark{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:800;letter-spacing:-.03em}
.wordmark svg{width:26px;height:26px;color:var(--laser)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-weight:700;font-size:14px}
.pill svg{width:16px;height:16px;color:var(--laser)}
.pill.off svg{color:var(--muted)}

/* Regla de XP */
.lvl{margin-bottom:14px}
.lvl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.lvl-name{font-weight:700;font-size:15px}
.lvl-xp{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ruler{position:relative;height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ruler>i{position:absolute;left:0;top:0;bottom:0;background:var(--laser);border-radius:4px 0 0 4px;transition:width .6s ease}
.ruler::after{content:"";position:absolute;inset:0 0 50% 0;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--tick) 9px 10px)}
.ruler.cur>i{background:var(--cur)}

/* Chip de entrevista */
.ivchip{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--laser-soft);color:var(--ink);font-size:14.5px;margin-bottom:14px}
.ivchip svg{width:20px;height:20px;color:var(--laser);flex:none}
.ivchip span{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted);font-weight:600;font-size:14px;margin-bottom:14px}

/* Sesión de hoy */
.hero{padding:20px 18px 18px;margin-bottom:14px}
.hero-n{font-size:20px;font-weight:600;margin:4px 0 12px}
.hero-n .big{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-right:6px}
.mix{display:flex;gap:4px;height:10px;margin-bottom:10px}
.mix span{border-radius:3px}
.m-s{background:var(--laser)}
.m-c{background:var(--cur)}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;color:var(--muted);font-size:14px;margin-bottom:16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.s{background:var(--laser)}
.dot.c{background:var(--cur)}
.hero-done{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 0 8px}
.hero.done p{margin-bottom:14px}
.hero.done .row .btn{flex:1 1 160px}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.wd i{width:100%;max-width:34px;height:8px;border-radius:4px;background:var(--surface-2)}
.wd.on i{background:var(--laser)}
.wd.today span{color:var(--ink);font-weight:700}

/* Listas de módulos */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec-h h3{font-size:18px;font-weight:700}
.mlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mrow{display:grid;grid-template-columns:28px 1fr 64px 42px;align-items:center;gap:10px;padding:13px 14px;text-align:left;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow:active{background:var(--surface-2)}
.mn{font-family:var(--f-mono);font-size:12.5px;color:var(--laser);font-weight:700}
.mn.c{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cur)}
.mt{font-weight:600;font-size:15.5px;min-width:0}
.mbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--laser)}
.mrow.c .mbar i{background:var(--cur)}
.mf{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* Pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabbar svg{width:23px;height:23px}
.tabbar button.on{color:var(--laser)}

/* Cabecera de página */
.phead{margin:6px 2px 14px}
.phead h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.phead p{margin-top:4px}
.top{margin-bottom:10px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;padding:6px 0}
.back svg{width:18px;height:18px}

/* Sesión */
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn svg{width:22px;height:22px}
.prog{flex:1;display:flex;gap:3px;min-width:0}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--surface-2);transition:background .3s}
.prog i.d{background:var(--laser)}
.prog i.c{background:var(--ink);opacity:.35}
.pcount{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pstat{display:flex;align-items:center;gap:8px;min-height:26px;margin:0 2px 10px}
.sxp{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--laser)}
.combo{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.combo.pop{animation:pop .35s ease}
.play{padding:18px 18px 20px}
.play.gold{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft),var(--shadow)}
.play.enter{animation:enter .32s cubic-bezier(.2,.8,.3,1)}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:14px}
.tag{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.is-s .tag{color:var(--laser)}
.is-c .tag{color:var(--cur)}
.badge{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.kind{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctitle{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-bottom:12px}
.ctx{color:var(--muted);font-size:15px;margin-bottom:14px}
.q{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:16px}
.q.big{font-size:22px;font-weight:700}

/* Texto de lectura */
.prose{font-family:var(--f-read);font-size:17.5px;line-height:1.55}
.prose p{margin:0 0 .75em}
.prose ul,.prose ol{margin:0 0 .75em;padding-left:1.25em}
.prose li{margin-bottom:.35em}
.prose li::marker{color:var(--muted)}
.prose strong{font-weight:600}
.prose>*:last-child{margin-bottom:0}
.say{margin:0 0 .85em;padding:10px 14px;border-radius:12px;background:var(--surface-2);font-family:var(--f-display);font-size:16px;line-height:1.4}
.say::before{content:"Dilo así";display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.say p{margin:0 0 .45em}
.say p:last-child{margin:0}
.dlg{display:flex;flex-direction:column;gap:8px;margin:0 0 .75em;font-family:var(--f-display);font-size:15.5px;line-height:1.38}
.bub{max-width:86%;padding:9px 12px 10px;border-radius:16px}
.bub .who{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.bub.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--laser-soft);border-bottom-right-radius:5px}
.key{margin-top:16px;padding:13px 14px;border-radius:12px;background:var(--laser-soft);font-weight:600;font-size:16px;line-height:1.35}
.is-c .key,.crow.c .key{background:var(--cur-soft)}

/* Opciones */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:500;font-size:16px;line-height:1.35;transition:border-color .15s,background .15s,opacity .15s}
.opt:active:not(:disabled){background:var(--surface-2)}
.opt .let{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--surface-2);font-family:var(--f-mono);font-size:12.5px;font-weight:700}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .let{background:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.ko .let{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.exp{margin-top:16px;scroll-margin-bottom:140px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;margin-bottom:8px}
.verdict svg{width:22px;height:22px}
.verdict.ok{color:var(--good)}
.verdict.ko{color:var(--bad)}
.verdict.meh{color:var(--meh)}
.answer{font-family:var(--f-mono);font-size:14px;margin-bottom:8px}

/* Respuesta libre */
textarea,input[type=text],input[type=date]{width:100%;font:16px/1.45 var(--f-display);color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{resize:vertical;min-height:120px}
.model{margin-top:16px;padding:14px;border-radius:14px;background:var(--good-soft);scroll-margin-bottom:140px}
.model .prose{font-size:16.5px}
.checks{margin-top:14px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;font-size:15.5px;cursor:pointer}
.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--good)}

/* Escenario */
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.chat .bub{font-size:15.5px}
.fb{padding:11px 13px;border-radius:12px;font-size:15px;line-height:1.38;scroll-margin-bottom:140px}
.fb b{display:block;margin-bottom:2px}
.fb.ok{background:var(--good-soft)} .fb.ok b{color:var(--good)}
.fb.meh{background:var(--meh-soft)} .fb.meh b{color:var(--meh)}
.fb.ko{background:var(--bad-soft)} .fb.ko b{color:var(--bad)}
.best{margin-top:8px;font-size:14.5px}
.score{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px}
.score b{font-family:var(--f-mono);font-size:30px}

/* Ordenar */
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.slot{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 13px;border-radius:14px;background:var(--surface-2);font-size:15.5px;line-height:1.35;border:1.5px solid transparent}
.slot.empty{border:1.5px dashed var(--line);background:none;color:var(--muted);min-height:48px}
.slot .sn{flex:none;font-family:var(--f-mono);font-weight:700;color:var(--laser);width:18px}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.slot.ko{border-color:var(--bad);background:var(--bad-soft)}
.corr{margin:6px 0 10px;padding-left:1.3em;font-size:15.5px}
.corr li{margin-bottom:4px}

/* Número */
.numrow{display:flex;align-items:center;gap:10px}
.numrow input{font-family:var(--f-mono);font-size:22px;font-weight:700;max-width:220px}
.unit{font-family:var(--f-mono);font-size:18px;color:var(--muted)}
.shake{animation:shake .3s}

/* Flash */
.back{margin-top:16px;padding:14px;border-radius:14px;background:var(--surface-2)}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.dock-hint{flex:1;text-align:center;color:var(--muted);font-size:14.5px;padding:15px 0}
.grade{flex:1;min-width:0;padding-inline:8px;font-size:15px;border:1.5px solid transparent}
.grade.ko{background:var(--bad-soft);color:var(--bad)}
.grade.meh{background:var(--meh-soft);color:var(--meh)}
.grade.ok{background:var(--good-soft);color:var(--good)}
.grade.sug{border-color:currentColor}

/* XP flotante y toast */
.fxp{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:80;transform:translateX(-50%);font:700 22px var(--f-mono);color:var(--laser);pointer-events:none;animation:rise .9s ease-out forwards;white-space:nowrap}
.fxp.gold{color:var(--gold)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}

/* Resumen */
.sum{padding-top:18px}
.sum-xp{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
.sum-xp span{font-size:72px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--laser);font-variant-numeric:tabular-nums}
.sum-xp small{font-family:var(--f-mono);font-size:18px;color:var(--muted)}
.sum h1{font-size:26px;font-weight:800;margin:8px 0 18px}
.levelup{display:inline-block;padding:8px 12px;border-radius:12px;background:var(--gold-soft);color:var(--gold);font-weight:700;margin-bottom:14px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}
.stats3 div{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}

.takeaways{padding:16px 18px;margin:18px 0}

.closing{margin:4px 2px 16px;color:var(--muted);font-size:14.5px}

.crow>summary,.crow.ex{display:grid;grid-template-columns:12px 74px 1fr;gap:10px;align-items:start;padding:13px 14px;list-style:none;cursor:pointer;text-align:left;width:100%}
.crow>summary::-webkit-details-marker{display:none}

.crow .prose{padding:14px 14px 4px;font-size:16.5px}
.crow .key{margin:4px 14px 12px}

.st{width:10px;height:10px;border-radius:50%;margin-top:5px;border:2px solid var(--muted)}
.st.ok{background:var(--good);border-color:var(--good)}

.ck{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* Chuleta */
.sheet{display:flex;flex-direction:column;gap:12px}

.fix{display:grid;grid-template-columns:1fr;gap:10px}

.set{padding:6px 16px;margin-bottom:12px}

@media (max-width:380px){.mrow{grid-template-columns:24px 1fr 46px 38px;gap:8px}.hero-n .big{font-size:48px}}

<body>
<main id="app" aria-live="polite"></main>
<nav id="tabbar" class="tabbar" aria-label="Secciones"></nav>
<div id="dock" class="dock" hidden><div class="in" id="dockin"></div></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="content.js"></script>
<script>
(function(){
"use strict";

/* ---------- Datos ---------- */
const D = window.CHISPA;
const MOD = Object.fromEntries(D.modules.map(m=>[m.id,m]));
const CARD = Object.fromEntries(D.cards.map(c=>[c.id,c]));
const isSales = c => MOD[c.m].area === "ventas";
const SALES = D.cards.filter(isSales);
const CUR = D.cards.filter(c=>!isSales(c));
const isEx = c => c.t !== "read";
const INTERVAL = [0,1,2,4,7,15,30];
const KIND = {read:"Lectura", quiz:"Pregunta", open:"Practica", scenario:"Simulación", order:"Ordena", num:"Cálculo", flash:"Memoria"};
const LEVELS = ["Becario curioso","Aprendiz que pregunta","Oído fino","Detective de necesidades","Calculador de valor","Negociador firme","Consultor técnico","Cerrador elegante","Key account","Leyenda de planta"];
const PRAISE = ["¡Correcto!","¡Eso es!","Bien visto","Exacto","¡Clavado!"];
const LS_KEY = "chispa.v1";

/* ---------- Estado ---------- */
function defState(){
  return {v:1, cards:{}, xp:0, days:{}, streak:{last:null,count:0,best:0},
          settings:{len:8, sound:true, interview:""}, fav:[], stats:{sessions:0}};
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw), d = defState();
      return Object.assign(d, s, {settings:Object.assign(d.settings, s.settings||{}), streak:Object.assign(d.streak, s.streak||{})});
    }
  }catch(e){}
  return defState();
}
let S = loadState();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2,"0");
function ymd(d){ d = d||new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dayNum(d){ d = d||new Date(); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000); }
function shiftDay(k){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()+k); }
function today(){ const k = ymd(); return S.days[k] || (S.days[k] = {done:false, extras:0, xp:0}); }
function curStreak(){
  const l = S.streak.last;
  return (l === ymd() || l === ymd(shiftDay(-1))) ? S.streak.count : 0;
}
function bumpStreak(){
  const t = ymd(), y = ymd(shiftDay(-1));
  if(S.streak.last === t) return;
  S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1;
  S.streak.last = t;
  S.streak.best = Math.max(S.streak.best||0, S.streak.count);
}

/* ---------- Repetición espaciada ---------- */
function st(c){ return S.cards[c.id] || {b:0, d:0, n:0, ok:0, ko:0, last:0}; }
const seen = c => !!(S.cards[c.id] && S.cards[c.id].n);
function mastered(c){ const s = S.cards[c.id]; if(!s || !s.n) return false; return c.t === "read" ? true : s.b >= 2; }
function record(c, r){
  const s = S.cards[c.id] || (S.cards[c.id] = {b:0, d:0, n:0, ok:0, ko:0, last:0});
  const t = dayNum();
  s.n++; s.last = t;
  if(r === "read"){ s.d = t + 9999; }
  else if(r === "ok"){ s.ok++; s.b = Math.min(6, Math.max(1, s.b) + 1); s.d = t + INTERVAL[s.b]; }
  else if(r === "meh"){ s.b = Math.max(1, s.b); s.d = t + 1; }
  else { s.ko++; s.b = 1; s.d = t + 1; }
}
function failedCards(){ return D.cards.filter(c=>isEx(c) && seen(c) && st(c).b <= 1); }

/* ---------- Niveles ---------- */
const need = L => 25*(L-1)*(L+2);
function levelOf(xp){ let L = 1; while(xp >= need(L+1)) L++; return {lvl:L, from:need(L), to:need(L+1), name:LEVELS[Math.min(L-1, LEVELS.length-1)]}; }

/* ---------- Construcción de sesiones ---------- */
function buildSession(kind, arg){
  const t = dayNum();
  if(kind === "daily" || kind === "extra"){
    const len = kind === "daily" ? S.settings.len : 4;
    const nCur = Math.round(len/4), nSales = len - nCur;
    const due = SALES.filter(c=>isEx(c) && seen(c) && st(c).d <= t)
      .sort((a,b)=> st(a).d - st(b).d || st(a).b - st(b).b);
    const reviews = due.slice(0, Math.ceil(nSales/2));
    const fresh = SALES.filter(c=>!seen(c)).slice(0, nSales - reviews.length);
    const sales = reviews.map(c=>({c, rev:true})).concat(fresh.map(c=>({c})));
    if(sales.length < nSales){
      const used = new Set(sales.map(x=>x.c.id));
      SALES.filter(c=>isEx(c) && seen(c) && !used.has(c.id))
        .sort((a,b)=> st(a).b - st(b).b || st(a).last - st(b).last)
        .slice(0, nSales - sales.length).forEach(c=>sales.push({c, rev:true}));
    }
    let cur = CUR.filter(c=>!seen(c)).slice(0, nCur);
    if(cur.length < nCur){
      const used = new Set(cur.map(c=>c.id));
      cur = cur.concat(CUR.filter(c=>!used.has(c.id)).sort((a,b)=> st(a).last - st(b).last).slice(0, nCur - cur.length));
    }
    // Una curiosidad cada pocas tarjetas de ventas, como descanso.
    const out = []; let ci = 0;
    sales.forEach((x,k)=>{
      out.push(x);
      if(ci < cur.length && k+1 >= Math.round((ci+1)*sales.length/cur.length)) out.push({c:cur[ci++]});
    });
    while(ci < cur.length) out.push({c:cur[ci++]});
    return out;
  }
  if(kind === "review"){
    return failedCards().sort((a,b)=> st(a).last - st(b).last).slice(0, 8).map(c=>({c, rev:true}));
  }
  if(kind === "module"){
    const cs = D.cards.filter(c=>c.m === arg);
    const unseen = cs.filter(c=>!seen(c));
    const pick = unseen.length ? unseen : cs.filter(isEx).sort((a,b)=> st(a).b - st(b).b);
    return pick.slice(0, 10).map(c=>({c, rev: !unseen.length}));
  }
  if(kind === "single"){ return [{c:CARD[arg]}]; }
  return [];
}

/* ---------- Sonido ---------- */
let AC = null;
function beep(seq){
  if(!S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const t0 = AC.currentTime;
    seq.forEach(([f, dt, dur, type, vol])=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0+dt);
      g.gain.exponentialRampToValueAtTime(vol || 0.07, t0+dt+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dt+dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t0+dt); o.stop(t0+dt+dur+0.03);
    });
  }catch(e){}
}
const SND = {
  ok:    ()=>beep([[660,0,.12],[990,.08,.2]]),
  combo: ()=>beep([[660,0,.1],[880,.07,.1],[1175,.14,.22]]),
  ko:    ()=>beep([[233,0,.25,"triangle",.06]]),
  meh:   ()=>beep([[440,0,.18,"sine",.05]]),
  read:  ()=>beep([[740,0,.08,"sine",.04]]),
  gold:  ()=>beep([[1047,0,.09,"sine",.05],[1319,.06,.09,"sine",.05],[1760,.12,.25,"sine",.05]]),
  level: ()=>beep([[523,0,.16],[659,.11,.16],[784,.22,.16],[1047,.33,.4]])
};

/* ---------- Iconos ---------- */
const sv = (p, extra) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra||""}>${p}</svg>`;
const ICON = {
  spark: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5l2.2 7.3 7.3 2.2-7.3 2.2L12 22.5l-2.2-9.3L2.5 11l7.3-2.2z"/><path stroke="currentColor" stroke-width="1.4" d="M0 11h24" opacity=".35"/></svg>`,
  flame: sv(`<path d="M12 22c4 0 7-2.7 7-6.6 0-3.1-1.8-5.2-3.4-7-.3 1.6-1.2 2.8-2.4 3.3.4-3.6-1.3-6.6-4.2-8.7.2 3-1.4 5.1-3 7C4.9 11.3 5 13 5 15.4 5 19.3 8 22 12 22z" fill="currentColor" stroke="none"/>`),
  x: sv(`<path d="M6 6l12 12M18 6L6 18"/>`),
  check: sv(`<path d="M5 12.5l4.5 4.5L19 7.5"/>`),
  back: sv(`<path d="M15 5l-7 7 7 7"/>`),
  star: sv(`<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/>`),
  starOn: sv(`<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="currentColor"/>`),
  today: sv(`<path d="M12 3l2 6.5 6.5 2-6.5 2L12 20l-2-6.5-6.5-2 6.5-2z"/>`),
  book: sv(`<path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5z"/><path d="M4 20.5A2.5 2.5 0 006.5 23H20"/><path d="M8 7.5h8M8 11h6"/>`),
  sheet: sv(`<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2.5h6V3M8.5 10h7M8.5 13.5h7M8.5 17h4"/>`),
  gear: sv(`<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>`),
  target: sv(`<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>`)
};

/* ---------- Texto ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>"); }
function md(text){
  let html = "", mode = null, m;
  const close = ()=>{
    if(mode === "ul") html += "</ul>"; else if(mode === "ol") html += "</ol>";
    else if(mode === "say" || mode === "dlg") html += "</div>"; else if(mode === "p") html += "</p>";
    mode = null;
  };
  String(text).split("\n").forEach(raw=>{
    const l = raw.replace(/\s+$/,"");
    if(!l.trim()){ close(); return; }
    if((m = l.match(/^\s*- (.*)/))){ if(mode !== "ul"){ close(); html += "<ul>"; mode = "ul"; } html += "<li>"+inline(m[1])+"</li>"; }
    else if((m = l.match(/^\s*\d+\. (.*)/))){ if(mode !== "ol"){ close(); html += "<ol>"; mode = "ol"; } html += "<li>"+inline(m[1])+"</li>"; }
    else if((m = l.match(/^> (.*)/))){ if(mode !== "say"){ close(); html += '<div class="say">'; mode = "say"; } html += "<p>"+inline(m[1])+"</p>"; }
    else if((m = l.match(/^(T|C): (.*)/))){
      if(mode !== "dlg"){ close(); html += '<div class="dlg">'; mode = "dlg"; }
      const me = m[1] === "T";
      html += '<div class="bub '+(me?"me":"them")+'"><span class="who">'+(me?"Tú":"Cliente")+"</span>"+inline(m[2])+"</div>";
    }
    else if(mode === "ul" || mode === "ol"){ html = html.replace(/<\/li>$/, "<br>"+inline(l.trim())+"</li>"); }
    else { if(mode !== "p"){ close(); html += "<p>"; mode = "p"; } else html += "<br>"; html += inline(l); }
  });
  close();
  return html;
}
const two = n => String(n).padStart(2,"0");
const fmtNum = n => Number(n).toLocaleString("es-ES", {maximumFractionDigits:2});

/* ---------- Marco ---------- */
const app = document.getElementById("app");
const tabbar = document.getElementById("tabbar");
const dock = document.getElementById("dock");
const dockin = document.getElementById("dockin");
let screen = "home", screenArg = null, SES = null, CS = {};

tabbar.innerHTML = `<div class="in">
  <button data-go="home">${ICON.today}<span>Hoy</span></button>
  <button data-go="temario">${ICON.book}<span>Temario</span></button>
  <button data-go="chuleta">${ICON.sheet}<span>Chuleta</span></button>
  <button data-go="ajustes">${ICON.gear}<span>Ajustes</span></button></div>`;

function go(s, arg){ screen = s; screenArg = arg === undefined ? null : arg; render(); window.scrollTo(0,0); }
function render(){
  const playing = screen === "play";
  tabbar.hidden = playing || screen === "summary";
  dock.hidden = !playing;
  document.body.classList.toggle("playing", playing);
  ({home:renderHome, temario:renderTemario, module:renderModule, chuleta:renderChuleta,
    ajustes:renderAjustes, play:renderPlay, summary:renderSummary})[screen]();
  tabbar.querySelectorAll("button").forEach(b=> b.classList.toggle("on", b.dataset.go === screen || (screen === "module" && b.dataset.go === "temario")));
}
function setDock(html){ dockin.innerHTML = html; }
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
function floatXP(xp, gold){
  if(!xp) return;
  const f = document.createElement("div"); f.className = "fxp"+(gold?" gold":""); f.textContent = "+"+xp+" XP";
  document.body.appendChild(f); setTimeout(()=>f.remove(), 950);
}

/* ---------- Inicio ---------- */
function levelBlock(){
  const lv = levelOf(S.xp), pct = Math.min(100, Math.round(100*(S.xp-lv.from)/(lv.to-lv.from)));
  return `<div class="lvl"><div class="lvl-top"><span class="lvl-name">Nivel ${lv.lvl} · ${lv.name}</span><span class="lvl-xp">${S.xp} / ${lv.to} XP</span></div>
    <div class="ruler" role="progressbar" aria-label="Progreso de nivel" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>`;
}
function interviewChip(){
  const iv = S.settings.interview;
  if(!iv) return `<button class="chip" data-go="ajustes">+ Añade la fecha de tu entrevista</button>`;
  const p = iv.split("-").map(Number);
  const diff = dayNum(new Date(p[0], p[1]-1, p[2])) - dayNum();
  const txt = diff > 1 ? `Entrevista en <b>${diff} días</b>`
    : diff === 1 ? `La entrevista es <b>mañana</b>. Repasa la chuleta y duerme bien.`
    : diff === 0 ? `La entrevista es <b>hoy</b>. Repasa la chuleta y a por ello.`
    : `¿Qué tal fue la entrevista? Cuéntaselo a Claude y completamos la app.`;
  return `<div class="ivchip">${ICON.target}<span>${txt}</span>${diff >= 0 && diff <= 1 ? `<button class="link" data-go="chuleta">Chuleta</button>` : ""}</div>`;
}
function weekStrip(){
  let out = "";
  for(let k=6; k>=0; k--){
    const dt = shiftDay(-k), rec = S.days[ymd(dt)], on = rec && rec.xp > 0;
    out += `<div class="wd${on?" on":""}${k===0?" today":""}"><span>${"DLMXJVS"[dt.getDay()]}</span><i></i></div>`;
  }
  return `<div class="week" aria-label="Actividad de los últimos 7 días">${out}</div>`;
}
function modProgress(m){ const cs = D.cards.filter(c=>c.m === m.id); return {done:cs.filter(mastered).length, total:cs.length}; }
function modRow(m){
  const p = modProgress(m), pct = Math.round(100*p.done/p.total), sales = m.area === "ventas";
  return `<button class="mrow${sales?"":" c"}" data-mod="${m.id}">${sales?`<span class="mn">${two(m.n)}</span>`:`<span><i class="mn c"></i></span>`}<span class="mt">${m.title}</span><span class="mbar"><i style="width:${pct}%"></i></span><span class="mf">${p.done}/${p.total}</span></button>`;
}
function renderHome(){
  const d = today(), streak = curStreak();
  let main;
  if(!d.done){
    const q = buildSession("daily"), nS = q.filter(x=>isSales(x.c)).length, nC = q.length - nS, rev = q.filter(x=>x.rev).length;
    main = `<section class="hero card">
      <div class="eyebrow">Sesión de hoy</div>
      <div class="hero-n"><span class="big">${q.length}</span>tarjetas</div>
      <div class="mix" aria-hidden="true"><span class="m-s" style="flex:${nS}"></span><span class="m-c" style="flex:${nC}"></span></div>

/* ---------- Sesión ---------- */
function startSession(kind, arg){
  const q = buildSession(kind, arg);
  if(!q.length){ toast("No hay tarjetas pendientes aquí."); return; }
  SES = {kind, arg, queue:q.map(x=>Object.assign({}, x, {gold: isEx(x.c) && kind !== "single" && Math.random() < 0.15})),
         i:0, xp:0, ok:0, total:0, combo:0, best:0, keys:[], requeued:{}, startLevel:levelOf(S.xp).lvl};
  go("play");
}
function curItem(){ return SES.queue[SES.i]; }
function mult(){ return SES.combo >= 5 ? 2 : SES.combo >= 3 ? 1.5 : 1; }
function outcome(c, r, base){
  const it = curItem();
  record(c, r);
  let xp = base;
  if(r === "read"){
    if(c.key) SES.keys.push(c.key);
    SND.read();
  } else {
    SES.total++;
    if(r === "ok"){ SES.ok++; SES.combo++; SES.best = Math.max(SES.best, SES.combo); xp = Math.round(base*mult()); }
    else if(r === "ko"){ SES.combo = 0; }
    if(r === "ok") (SES.combo >= 3 ? SND.combo : SND.ok)(); else if(r === "meh") SND.meh(); else SND.ko();
    if(r === "ko" && !it.retry && !SES.requeued[c.id] && SES.kind !== "single"){
      SES.requeued[c.id] = true; SES.queue.push({c, retry:true});
    }
  }
  if(it.gold) xp *= 2;
  SES.xp += xp; S.xp += xp; today().xp += xp;
  save();
  floatXP(xp, it.gold);
  refreshStat();
}
function refreshStat(){
  const el = document.getElementById("pstat"); if(!el) return;
  el.innerHTML = `<span class="sxp">+${SES.xp} XP</span>${SES.combo >= 2 ? `<span class="combo pop">Racha ×${SES.combo}${mult() > 1 ? ` · XP ×${String(mult()).replace(".",",")}` : ""}</span>` : ""}`;
  const segs = document.getElementById("prog");
  if(segs) segs.innerHTML = progSegs();
  const cnt = document.getElementById("pcount"); if(cnt) cnt.textContent = (SES.i+1)+"/"+SES.queue.length;
}
function progSegs(){ return SES.queue.map((_,k)=>`<i class="${k < SES.i ? "d" : k === SES.i ? "c" : ""}"></i>`).join(""); }
function nextDock(){
  const last = SES.i >= SES.queue.length - 1;
  setDock(`<button class="btn primary grow" data-act="next">${last ? "Terminar" : "Siguiente"}</button>`);
}
function advance(){
  SES.i++;
  if(SES.i >= SES.queue.length) finishSession(); else { renderPlay(); window.scrollTo(0,0); }
}
function finishSession(){
  const d = today();
  if(SES.kind === "daily") d.done = true;
  if(SES.kind === "extra") d.extras++;
  if(SES.total + SES.keys.length > 0) bumpStreak();
  S.stats.sessions = (S.stats.sessions||0) + 1;
  save();
  go("summary");
}
function verdict(kind, text){
  const ic = kind === "ok" ? ICON.check : kind === "ko" ? ICON.x : ICON.target;
  return `<div class="verdict ${kind}">${ic}${text}</div>`;
}
const praise = ()=> PRAISE[Math.floor(Math.random()*PRAISE.length)];

function scStep(c){
  const s = c.steps[CS.step];
  document.getElementById("chat").insertAdjacentHTML("beforeend", `<div class="bub them"><span class="who">Cliente</span>${inline(s.c)}</div>`);
  document.getElementById("scopts").innerHTML = s.o.map((o,k)=>`<button class="opt" data-act="sc-opt" data-i="${k}"><span class="let">${"ABC"[k]}</span><span>${inline(o.t)}</span></button>`).join("");
  setDock(`<div class="dock-hint">Paso ${CS.step+1} de ${c.steps.length} · elige tu respuesta</div>`);
}
function drawOrder(c){
  const n = c.items.length;
  let slots = CS.placed.map((idx,k)=>`<button class="slot" data-act="ord-un" data-k="${k}"><span class="sn">${k+1}</span><span>${inline(c.items[idx])}</span></button>`).join("");
  for(let k = CS.placed.length; k < n; k++) slots += `<div class="slot empty"><span class="sn">${k+1}</span><span>…</span></div>`;
  document.getElementById("slots").innerHTML = slots;
  document.getElementById("pool").innerHTML = CS.pool.filter(i=>!CS.placed.includes(i)).map(i=>`<button class="opt" data-act="ord-pick" data-i="${i}"><span class="let">+</span><span>${inline(c.items[i])}</span></button>`).join("");
  setDock(CS.placed.length === n ? `<button class="btn primary grow" data-act="ord-check">Comprobar</button>` : `<div class="dock-hint">Toca las frases en el orden correcto</div>`);
}
function parseNum(s){
  s = String(s).replace(/[\s€%]/g,"").replace(/meses?/i,"");
  if(!s) return null;
  const a = parseFloat(s.replace(",", ".")), b = parseFloat(s.replace(/\./g,"").replace(",", "."));
  const out = [a,b].filter(x=>!isNaN(x));
  return out.length ? out : null;
}
function checkNum(){
  const c = curItem().c, inp = document.getElementById("num-"+c.id);
  if(CS.done) return;
  const v = parseNum(inp.value);
  if(!v){ inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.focus(); return; }
  CS.done = true; inp.disabled = true;
  const ok = v.some(x=>Math.abs(x - c.a) <= c.tol);
  const ex = document.getElementById("exp");
  ex.innerHTML = verdict(ok?"ok":"ko", ok ? praise() : "No exactamente") + `<div class="answer">Respuesta: <b>${fmtNum(c.a)} ${c.unit||""}</b></div><div class="prose">${md(c.exp)}</div>`;
  ex.hidden = false;
  outcome(c, ok?"ok":"ko", ok?15:3);
  nextDock();
  ex.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function countUp(el, to){
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce || !to){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 900;
  (function f(t){ const p = Math.min(1, (t-t0)/dur); el.textContent = Math.round(to*(1-Math.pow(1-p,3))); if(p < 1) requestAnimationFrame(f); })(t0);
}
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--laser","--cur","--gold","--good"].map(v=>cs.getPropertyValue(v).trim());
  const P = Array.from({length:110}, ()=>({x:innerWidth/2 + (Math.random()-.5)*80, y:innerHeight*.32, vx:(Math.random()-.5)*9, vy:-Math.random()*9-3,
    s:4+Math.random()*5, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function f(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{ p.vy += .25; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t - t0 < 1800) requestAnimationFrame(f); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

      <div class="seg" role="group" aria-label="Tarjetas por sesión">${[8,12,16].map(v=>`<button data-act="len" data-v="${v}" class="${S.settings.len===v?"on":""}">${v}</button>`).join("")}</div></div>
    <div class="srow"><label for="ivdate"><b>Fecha de la entrevista</b><span class="muted small">Para la cuenta atrás</span></label>
      <input type="date" id="ivdate" value="${esc(S.settings.interview)}"></div>
    <div class="srow"><div><b>Sonido</b><span class="muted small">Avisos cortos al acertar y fallar</span></div>
      <button class="switch${S.settings.sound?" on":""}" data-act="sound" role="switch" aria-checked="${S.settings.sound}" aria-label="Sonido"><i></i></button></div>
  </div>
  <div class="set card">
    <div class="srow col"><div><b>Copia de seguridad</b><span class="muted small">El progreso se guarda solo en este dispositivo. Copia el código y pégalo en una nota para no perderlo.</span></div>
      <div class="row"><button class="btn ghost" data-act="export">Copiar código</button><button class="btn ghost" data-act="import-show">Restaurar</button></div>
      <textarea id="exptext" rows="3" readonly hidden aria-label="Código de copia"></textarea>
      <div id="imp" hidden><label class="sr" for="imptext">Código</label><textarea id="imptext" rows="3" placeholder="Pega aquí el código"></textarea><button class="btn primary wide" data-act="import">Restaurar progreso</button></div>
    </div>
  </div>
  <div class="set card">
    <div class="srow"><div><b>Reiniciar progreso</b><span class="muted small">Borra XP, rachas y repasos</span></div><button class="btn ghost danger" data-act="reset-ask">Reiniciar</button></div>
    <div id="resetc" class="row" hidden><span>¿Seguro? No se puede deshacer.</span><button class="btn danger" data-act="reset-yes">Sí, borrar</button><button class="btn ghost" data-act="reset-no">Cancelar</button></div>
  </div>
  <p class="muted small center">Chispa 1.0 · ${SALES.length} tarjetas de ventas y ${CUR.length} curiosidades · ${S.stats.sessions||0} sesiones hechas</p>`;
  document.getElementById("ivdate").addEventListener("change", e=>{ S.settings.interview = e.target.value; save(); toast(e.target.value ? "Fecha guardada" : "Fecha borrada"); });
}

/* ---------- Acciones ---------- */
const ACT = {
  start(t){ startSession(t.dataset.kind, t.dataset.arg); },
  home(){ SES = null; go("home"); },
  quit(){ SES = null; go("home"); },
  next(){ advance(); },
  "read-ok"(){ if(CS.done) return; CS.done = true; outcome(curItem().c, "read", 5); setTimeout(advance, 180); },
  fav(t){
    const id = curItem().c.id, i = S.fav.indexOf(id);
    if(i >= 0) S.fav.splice(i,1); else S.fav.push(id);
    save(); const on = i < 0;
    t.innerHTML = on ? ICON.starOn : ICON.star; t.setAttribute("aria-pressed", on); t.style.color = on ? "var(--gold)" : "";
    toast(on ? "Guardada en el temario" : "Quitada de guardadas");
  },
  "fav-lib"(t){
    const id = t.dataset.arg, i = S.fav.indexOf(id);
    if(i >= 0) S.fav.splice(i,1); else S.fav.push(id);
    save(); t.textContent = i >= 0 ? "Guardar" : "Quitar de guardadas";
  },
  "open-card"(t){ const c = CARD[t.dataset.arg]; go("module", {id:c.m, open:c.id}); },
  opt(t){
    if(CS.done) return; CS.done = true;
    const c = curItem().c, i = +t.dataset.i, ok = i === c.a;
    document.querySelectorAll("#cb .opt").forEach((b,k)=>{ b.disabled = true; b.classList.add(k === c.a ? "ok" : k === i ? "ko" : "dim"); });
    const ex = document.getElementById("exp");
    ex.innerHTML = verdict(ok?"ok":"ko", ok ? praise() : "No era esa") + `<div class="prose">${md(c.exp)}</div>`;
    ex.hidden = false;
    outcome(c, ok?"ok":"ko", ok?10:2);
    nextDock();
    ex.scrollIntoView({behavior:"smooth", block:"nearest"});
  },
  reveal(){
    if(CS.revealed) return; CS.revealed = true;
    const c = curItem().c, r = document.getElementById("reveal");
    r.innerHTML = `<div class="model"><span class="lbl">Respuesta modelo</span><div class="prose">${md(c.model)}</div></div>
      <div class="checks"><span class="lbl">¿Lo has incluido?</span>${c.check.map((x,k)=>`<label class="chk"><input type="checkbox" id="chk-${c.id}-${k}" data-act="chk"><span>${inline(x)}</span></label>`).join("")}</div>`;
    r.hidden = false;
    setDock(`<button class="btn grade ko" data-act="grade" data-g="0">Fallé</button><button class="btn grade meh" data-act="grade" data-g="1">Regular</button><button class="btn grade ok" data-act="grade" data-g="2">Lo clavé</button>`);
    r.querySelector(".model").scrollIntoView({behavior:"smooth", block:"start"});
  },
  chk(){
    const boxes = [...document.querySelectorAll("#reveal input[type=checkbox]")];
    const ratio = boxes.filter(b=>b.checked).length / boxes.length;
    const g = ratio >= .75 ? 2 : ratio >= .4 ? 1 : 0;
    dockin.querySelectorAll(".grade").forEach(b=> b.classList.toggle("sug", +b.dataset.g === g));
  },
  grade(t){
    if(CS.done) return; CS.done = true;
    const g = +t.dataset.g;
    outcome(curItem().c, ["ko","meh","ok"][g], [3,8,15][g]);
    setTimeout(advance, 450);
  },
  "sc-opt"(t){
    if(CS.picked) return; CS.picked = true;
    const c = curItem().c, s = c.steps[CS.step], o = s.o[+t.dataset.i], best = s.o.find(x=>x.p === 2);
    CS.pts += o.p;
    const cls = ["ko","meh","ok"][o.p], head = ["Mejorable","Regular","Muy bien"][o.p];
    document.getElementById("scopts").innerHTML = "";
    const chat = document.getElementById("chat");
    chat.insertAdjacentHTML("beforeend", `<div class="bub me"><span class="who">Tú</span>${inline(o.t)}</div>
      <div class="fb ${cls}"><b>${head}</b>${inline(o.f)}${o.p < 2 && best ? `<div class="best"><span class="lbl">Mejor respuesta</span>«${inline(best.t)}»</div>` : ""}</div>`);
    (o.p === 2 ? SND.ok : o.p === 1 ? SND.meh : SND.ko)();
    const last = CS.step >= c.steps.length - 1;
    setDock(`<button class="btn primary grow" data-act="sc-next">${last ? "Ver resultado" : "Continuar"}</button>`);
    chat.lastElementChild.scrollIntoView({behavior:"smooth", block:"nearest"});
  },
  "sc-next"(){
    const c = curItem().c;
    CS.picked = false; CS.step++;
    if(CS.step < c.steps.length){ scStep(c); document.getElementById("scopts").scrollIntoView({behavior:"smooth", block:"nearest"}); return; }
    const max = c.steps.length*2, ratio = CS.pts/max, r = ratio >= .8 ? "ok" : ratio >= .5 ? "meh" : "ko";
    const end = document.getElementById("scend");
    end.innerHTML = `<div class="exp">${verdict(r, r === "ok" ? "Gran conversación" : r === "meh" ? "Vas por buen camino" : "A repasar")}<div class="score"><b>${CS.pts}/${max}</b><span class="muted">puntos</span></div><div class="prose">${md(c.sum)}</div></div>`;
    end.hidden = false;
    outcome(c, r, CS.pts*3);
    nextDock();
    end.scrollIntoView({behavior:"smooth", block:"nearest"});
  },
  "ord-pick"(t){ if(CS.done) return; CS.placed.push(+t.dataset.i); SND.read(); drawOrder(curItem().c); },
  "ord-un"(t){ if(CS.done) return; CS.placed.splice(+t.dataset.k, 1); drawOrder(curItem().c); },
  "ord-check"(){
    if(CS.done) return; CS.done = true;
    const c = curItem().c, ok = CS.placed.every((v,k)=>v === k);
    document.querySelectorAll("#slots .slot").forEach((el,k)=>{ el.disabled = true; el.classList.add(CS.placed[k] === k ? "ok" : "ko"); });
    const ex = document.getElementById("exp");
    ex.innerHTML = verdict(ok?"ok":"ko", ok ? praise() : "El orden era otro") + (ok ? "" : `<ol class="corr">${c.items.map(x=>`<li>${inline(x)}</li>`).join("")}</ol>`) + `<div class="prose">${md(c.exp)}</div>`;
    ex.hidden = false;
    outcome(c, ok?"ok":"ko", ok?12:3);
    nextDock();
    ex.scrollIntoView({behavior:"smooth", block:"nearest"});
  },
  "num-check"(){ checkNum(); },
  "flash-show"(){
    const c = curItem().c, b = document.getElementById("back");
    b.innerHTML = `<div class="prose">${md(c.back)}</div>`; b.hidden = false;
    setDock(`<button class="btn grade ko" data-act="flash-grade" data-g="0">No lo sabía</button><button class="btn grade ok" data-act="flash-grade" data-g="2">Lo sabía</button>`);
    b.scrollIntoView({behavior:"smooth", block:"nearest"});
  },
  "flash-grade"(t){
    if(CS.done) return; CS.done = true;
    const g = +t.dataset.g;
    outcome(curItem().c, g ? "ok" : "ko", g ? 6 : 2);
    setTimeout(advance, 450);
  },
  len(t){ S.settings.len = +t.dataset.v; save(); renderAjustes(); },
  sound(){ S.settings.sound = !S.settings.sound; save(); renderAjustes(); if(S.settings.sound) SND.ok(); },
  export(){
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const ta = document.getElementById("exptext");
    const show = ()=>{ ta.value = code; ta.hidden = false; ta.focus(); ta.select(); toast("Selecciona y copia el código"); };
    try{ navigator.clipboard.writeText(code).then(()=>toast("Código copiado"), show); }catch(e){ show(); }
  },
  "import-show"(){ document.getElementById("imp").hidden = false; document.getElementById("imptext").focus(); },
  import(){
    try{
      const s = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("imptext").value.trim()))));
      if(!s || typeof s.cards !== "object") throw 0;
      const d = defState();
      S = Object.assign(d, s, {settings:Object.assign(d.settings, s.settings||{}), streak:Object.assign(d.streak, s.streak||{})});
      save(); toast("Progreso restaurado"); go("home");
    }catch(e){ toast("El código no es válido. Cópialo entero e inténtalo de nuevo."); }
  },
  "reset-ask"(){ document.getElementById("resetc").hidden = false; },
  "reset-no"(){ document.getElementById("resetc").hidden = true; },
  "reset-yes"(){ S = defState(); save(); toast("Progreso borrado"); go("home"); }
};

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act],[data-go],[data-mod]");
  if(!t || t.disabled) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.mod){ go("module", t.dataset.mod); return; }
  const f = ACT[t.dataset.act]; if(f) f(t, e);
});
document.addEventListener("keydown", e=>{
  if(e.key === "Enter" && e.target && e.target.id && e.target.id.indexOf("num-") === 0){ e.preventDefault(); checkNum(); }
});

/* ---------- Arranque ---------- */
try{ if(window.top !== window.self) document.documentElement.classList.add("embedded"); }catch(e){ document.documentElement.classList.add("embedded"); }
render();

/* ---------- PWA: service worker y avisos de versión ---------- */
if("serviceWorker" in navigator && !document.documentElement.classList.contains("embedded") && location.protocol !== "file:"){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      function notifyUpdate(worker){
        const bar = document.createElement("div");
        bar.className = "toast";
        bar.style.cssText = "top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px";
        bar.innerHTML = "<span>Hay una versión nueva de Chispa</span>";
        const b = document.createElement("button");
        b.textContent = "Actualizar"; b.className = "link"; b.style.color = "var(--laser)";
        b.onclick = ()=>{ worker.postMessage("SKIP_WAITING"); bar.remove(); };
        bar.appendChild(b); document.body.appendChild(bar);
      }
      if(reg.waiting) notifyUpdate(reg.waiting);
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing; if(!nw) return;
        nw.addEventListener("statechange", ()=>{ if(nw.state === "installed" && navigator.serviceWorker.controller) notifyUpdate(nw); });
      });
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reg.update(); });
    }).catch(()=>{});
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(refreshing) return; refreshing = true; location.reload(); });
  });
}
})();
</script>
</body>
</html>
