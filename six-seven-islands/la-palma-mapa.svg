<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Isla 1, inspirada en La Palma: recorrido propuesto</title>
  <rect width="640" height="820" fill="#bfeef3"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#3b2a20">Isla 1 · inspirada en La Palma (boceto)</text>
  <text x="320" y="56" text-anchor="middle" font-size="12" fill="#3b2a20">Norte arriba. Las cumbres del centro no se cruzan: el camino da la vuelta a la isla.</text>

  <!-- Isla: más ancha al norte y en punta al sur -->
  <path d="M300 78 C390 72 478 120 500 210 C520 290 492 360 470 420 C448 490 410 560 372 630 C350 680 330 735 306 770 C282 735 262 690 240 640 C206 570 168 500 150 430 C126 340 112 250 150 170 C182 104 236 82 300 78 Z"
        fill="#E8B878" stroke="#B98A5A" stroke-width="3"/>
  <path d="M300 92 C382 88 462 132 482 212 C500 288 474 356 454 414 C432 482 396 552 360 622 C340 668 322 716 306 748 C286 714 270 676 252 632 C220 566 184 498 166 430 C144 344 132 256 166 178 C194 118 242 96 300 92 Z"
        fill="#7ED6A5"/>

  <!-- Cumbres y caldera (no se cruzan) -->
  <path d="M300 300 C330 360 330 450 318 540 C312 590 306 620 304 640 C296 620 290 590 284 540 C272 450 270 360 300 300 Z" fill="#A9AFD6" opacity="0.9"/>
  <circle cx="300" cy="250" r="74" fill="#A9AFD6"/>
  <circle cx="300" cy="256" r="44" fill="#8f97c8"/>
  <text x="300" y="260" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Caldera</text>
  <!-- Observatorio en el borde norte de la caldera -->
  <g transform="translate(300 180)">
    <circle cx="-14" cy="0" r="7" fill="#fff" stroke="#6B7BB8" stroke-width="2"/>
    <circle cx="6" cy="-3" r="9" fill="#fff" stroke="#6B7BB8" stroke-width="2"/>
  </g>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">observatorio</text>
  <!-- Volcán del sur -->
  <path d="M332 600 L352 560 L372 600 Z" fill="#6f5f5f"/>
  <path d="M346 572 L352 560 L358 572 Z" fill="#FF6B6B"/>
  <text x="380" y="590" font-size="11" fill="#3b2a20">volcán (referencia)</text>

  <!-- Bosque de laurisilva: norte, de oeste a este -->
  <path d="M176 230 C190 150 240 112 300 108 C362 108 426 140 452 210 C440 236 420 246 396 236 C380 196 344 168 300 168 C254 168 222 196 210 240 C196 250 182 246 176 230 Z" fill="#3f9f6c" opacity="0.85"/>

  <!-- Camino: 1 → 2 → 3 → 4 → 5 -->
  <path d="M300 712 C262 676 236 640 222 596 C206 546 192 500 186 452 C178 400 182 330 196 262 C214 170 270 132 320 132 C376 134 420 170 432 226 C444 290 446 350 436 408"
        fill="none" stroke="#3b2a20" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Hierba alta de la zona de combates -->
  <g fill="#2f7f52" opacity="0.85">
    <ellipse cx="214" cy="612" rx="16" ry="10"/>
    <ellipse cx="196" cy="560" rx="18" ry="11"/>
    <ellipse cx="206" cy="508" rx="15" ry="10"/>
  </g>

  <!-- Zonas -->
  <g font-size="12" fill="#3b2a20">
    <circle cx="300" cy="712" r="30" fill="#fff6ea" stroke="#3b2a20" stroke-width="2"/>
    <text x="300" y="708" text-anchor="middle" font-weight="700" font-size="16">1</text>
    <text x="300" y="724" text-anchor="middle" font-size="9">museo</text>
    <text x="344" y="740" font-weight="700">Zona inicial</text>
    <text x="344" y="755">sur volcánico: 2 casas, drago, museo</text>

    <circle cx="206" cy="560" r="22" fill="#fff6ea" stroke="#3b2a20" stroke-width="2" opacity="0.92"/>
    <text x="206" y="566" text-anchor="middle" font-weight="700" font-size="16">2</text>
    <text x="20" y="560" font-weight="700">Zona de combates</text>
    <text x="20" y="575">3 hierbas, 2 entrenadores</text>
    <text x="20" y="590">(1 obligatorio)</text>

    <circle cx="184" cy="420" r="26" fill="#fff6ea" stroke="#3b2a20" stroke-width="2"/>
    <text x="184" y="426" text-anchor="middle" font-weight="700" font-size="16">3</text>
    <text x="20" y="462" font-weight="700">Pueblo</text>
    <text x="20" y="477">valle del oeste, plataneras:</text>
    <text x="20" y="492">refugio, tienda, 2 casas, anciano</text>

    <circle cx="300" cy="134" r="22" fill="#fff6ea" stroke="#3b2a20" stroke-width="2"/>
    <text x="300" y="140" text-anchor="middle" font-weight="700" font-size="16">4</text>
    <text x="150" y="96" font-weight="700">Bosque de laurisilva</text>
    <text x="150" y="111">niebla, helechos, cascada</text>

    <circle cx="436" cy="420" r="30" fill="#fff6ea" stroke="#3b2a20" stroke-width="2"/>
    <text x="436" y="426" text-anchor="middle" font-weight="700" font-size="16">5</text>
    <text x="488" y="380" font-weight="700">Capital</text>
    <text x="488" y="395">costa este, balcones:</text>
    <text x="488" y="410">refugio, gimnasio, casas</text>
    <text x="488" y="425">rival (solo habla)</text>
    <!-- Puerto -->
    <rect x="478" y="440" width="30" height="8" fill="#B98A5A"/>
    <path d="M512 452 L540 452 L534 462 L516 462 Z" fill="#fff"/>
    <path d="M524 452 L524 436 L536 448 Z" fill="#FF6B6B"/>
    <text x="488" y="482" font-weight="700">Puerto → isla 2</text>
    <text x="488" y="497">tras el gimnasio</text>
  </g>

  <!-- Candados -->
  <g font-size="10" fill="#3b2a20">
    <g transform="translate(262 672)"><rect x="-8" y="-4" width="16" height="12" rx="2" fill="#FF6B6B"/><path d="M-5 -4 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#FF6B6B" stroke-width="2.5"/></g>
    <text x="222" y="668" text-anchor="end">elegir inicial</text>
    <g transform="translate(186 330)"><rect x="-8" y="-4" width="16" height="12" rx="2" fill="#FF6B6B"/><path d="M-5 -4 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#FF6B6B" stroke-width="2.5"/></g>
    <text x="20" y="334">hablar con el anciano (propuesta)</text>
    <g transform="translate(470 448)"><rect x="-8" y="-4" width="16" height="12" rx="2" fill="#FF6B6B"/><path d="M-5 -4 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#FF6B6B" stroke-width="2.5"/></g>
  </g>

  <!-- Leyenda -->
  <g font-size="11" fill="#3b2a20" transform="translate(20 690)">
    <rect width="190" height="104" rx="8" fill="#fff6ea" opacity="0.94"/>
    <path d="M12 18 h28" stroke="#3b2a20" stroke-width="3" stroke-dasharray="8 6"/><text x="48" y="22">recorrido</text>
    <ellipse cx="26" cy="40" rx="12" ry="7" fill="#2f7f52"/><text x="48" y="44">hierba alta</text>
    <rect x="18" y="56" width="16" height="12" rx="2" fill="#FF6B6B"/><text x="48" y="66">paso cerrado hasta…</text>
    <circle cx="26" cy="86" r="9" fill="#A9AFD6"/><text x="48" y="90">cumbres: no se cruzan</text>
  </g>
</svg>
