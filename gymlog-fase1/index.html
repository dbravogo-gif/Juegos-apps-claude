<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F6FA">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GymLog">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>GymLog</title>
<style>
:root{
  color-scheme: light only;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg:#F4F6FA;
  --surface:#FFFFFF;
  --surface-2:#EAEEF5;
  --line:#DCE3ED;
  --accent:#1F3A5F;
  --accent-dim:#B7C4D8;
  --text:#1A2331;
  --muted:#5C6675;
  --danger:#C0504D;
  --good:#2E8B57;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:var(--font-ui); overscroll-behavior:none; user-select:none;
  -webkit-text-size-adjust:100%;}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
.num{font-family:var(--font-mono);}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input{font-family:inherit; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:10px 12px; font-size:16px; width:100%;}
input:focus{outline:1.5px solid var(--accent);}
#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative;
  padding:calc(18px + env(safe-area-inset-top)) 16px 90px;}
body.resting #app{padding-bottom:150px;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.back{font-size:15px; color:var(--muted); display:flex; align-items:center; gap:6px; padding:6px 0;}
.back:active{color:var(--accent);}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;}
.title{font-size:26px; font-weight:600;}

/* HOME */
.routine-card{background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:20px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
.routine-card:active{border-color:var(--accent);}
.routine-name{font-size:21px; font-weight:600;}
.routine-tags{color:#4A5568; font-size:13.5px; margin-top:4px;}
.routine-arrow{font-size:22px; color:var(--accent);}
.homefoot{display:flex; gap:10px; margin-top:22px;}
.pill-btn{flex:1; text-align:center; padding:14px; border-radius:12px; background:var(--surface-2);
  border:1px solid var(--line); font-size:14px; color:var(--muted);}
.pill-btn:active{color:var(--text); border-color:var(--accent);}

/* WORKOUT LIST */
.ex-row{background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:16px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px;}
.ex-row:active{border-color:var(--accent);}
.chk{width:24px; height:24px; border-radius:7px; border:2px solid var(--muted); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:15px;}
.chk.done{border-color:var(--good); background:var(--good); color:var(--bg);}
.ex-row-body{flex:1;}
.ex-row-name{font-size:17px; font-weight:500;}
.ex-row-meta{font-size:12.5px; color:var(--muted); margin-top:2px;}

/* EXERCISE DETAIL */
.section{margin-bottom:22px;}
.section-label{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; font-weight:600;}
.set-row{display:grid; grid-template-columns:34px 1fr 1fr 44px; gap:8px; align-items:center; margin-bottom:8px;}
.set-idx{color:var(--muted); font-size:14px; text-align:center;}
.set-check{width:36px; height:36px; border-radius:10px; border:2px solid var(--muted);
  display:flex; align-items:center; justify-content:center; font-size:17px; margin:0 auto;}
.set-check.done{background:var(--good); border-color:var(--good); color:var(--bg);}
.field-label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px;}
.set-input{text-align:center; font-size:17px;}
.add-set{width:100%; padding:12px; border-radius:10px; border:1.5px dashed var(--line); color:var(--muted); font-size:14px; margin-top:4px;}
.add-set:active{border-color:var(--accent); color:var(--accent);}

.history-block{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
.history-date{font-size:13px; color:var(--accent); font-weight:600; margin-bottom:8px;}
.history-set{font-size:15.5px; color:var(--text); display:flex; justify-content:space-between; padding:2px 0;}
.history-set span:last-child{color:var(--muted);}
.empty-note{color:#4A5568; font-size:14px; font-style:italic;}

.progress-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:10px;}
.progress-goal{font-size:15px; margin-bottom:12px;}
.progress-goal b{color:var(--accent);}
.progress-rule{display:flex; gap:10px; margin-bottom:10px; align-items:flex-start;}
.progress-rule:last-child{margin-bottom:0;}
.rule-dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0;}
.rule-up .rule-dot{background:var(--good);}
.rule-keep .rule-dot{background:var(--accent);}
.rule-down .rule-dot{background:var(--danger);}
.rule-text b{display:block; font-size:13.5px; margin-bottom:2px;}
.rule-text span{font-size:13.5px; color:var(--muted); line-height:1.4;}

.info-item{margin-bottom:16px;}
.info-item:last-child{margin-bottom:0;}
.info-h{font-size:13px; font-weight:600; color:var(--accent); margin-bottom:5px;}
.info-p{font-size:14.5px; line-height:1.55; color:#3A4454;}
.muscle-tags{display:flex; flex-wrap:wrap; gap:6px;}
.mtag{background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:5px 12px; font-size:12.5px;}
.mtag.primary{border-color:var(--accent); color:var(--accent);}

/* HISTORY SCREEN */
.hist-day{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:10px;}
.hist-day-top{display:flex; justify-content:space-between; margin-bottom:6px;}
.hist-day-date{font-weight:600; font-size:16px;}
.hist-day-routine{color:var(--accent); font-size:13px;}
.hist-ex{font-size:13.5px; color:var(--muted); margin-top:4px;}

/* EDITOR */
.edit-row{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
.edit-drag{color:var(--muted); font-size:15px;}
.edit-name{flex:1; font-size:15px;}
.edit-del{color:var(--danger); font-size:13px; padding:4px 8px;}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
.field{margin-bottom:10px;}
.save-btn{width:100%; background:var(--accent); color:#FFFFFF; font-weight:700; padding:15px; border-radius:12px; font-size:16px; margin-top:8px;}
.save-btn:active{opacity:.85;}
.add-ex-btn{width:100%; padding:14px; border-radius:12px; border:1.5px dashed var(--line); color:var(--accent); font-size:14.5px; margin-top:6px; margin-bottom:20px;}

/* TIMER */
.fab{position:fixed; bottom:20px; right:20px; width:54px; height:54px; border-radius:50%;
  background:var(--accent); color:#FFFFFF; font-size:20px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.45); z-index:50;}

.checkbox-box{position:relative; display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--surface-2);
  border:1px solid var(--accent); padding:10px 18px; border-radius:20px; font-size:13.5px; z-index:80; opacity:0; transition:opacity .25s;}
.toast.show{opacity:1;}

/* EXTENDER SERIES */
.extend-btn{width:100%; padding:11px; border-radius:10px; background:var(--surface-2); border:1px solid var(--accent-dim);
  color:var(--accent); font-size:13.5px; margin-top:2px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:6px;}
.extend-btn:active{border-color:var(--accent); background:rgba(232,163,61,.12);}

/* MODALES (sustituyen a confirm/prompt del navegador) */
.modal-overlay{position:fixed; inset:0; background:rgba(20,28,40,.5); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.modal-box{background:var(--surface); border:1px solid var(--line); border-radius:18px 18px 0 0; width:100%; max-width:520px;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom)); box-shadow:0 -10px 30px rgba(0,0,0,.5); max-height:78vh; overflow-y:auto;}
.modal-title{font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:6px;}
.modal-msg{font-size:15px; color:#3A4454; line-height:1.5; margin-bottom:18px;}
.modal-btns{display:flex; gap:10px;}
.modal-btn{flex:1; text-align:center; padding:14px; border-radius:12px; font-size:15px; font-weight:600;}
.modal-btn-cancel{background:var(--surface-2); border:1px solid var(--line); color:var(--muted);}
.modal-btn-cancel:active{color:var(--text);}
.modal-btn-ok{background:var(--accent); color:#FFFFFF;}
.modal-btn-ok:active{opacity:.85;}
.modal-list-item{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:8px; font-size:15px;}
.modal-list-item:active{border-color:var(--accent);}
.modal-list-item.new{color:var(--accent); border-style:dashed; text-align:center;}
.modal-search{margin-bottom:14px;}

.move-badge{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:2px 7px; border-radius:6px; border:1px solid; white-space:nowrap;}
.legend-item{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:10px;}
.legend-desc{font-size:14px; color:#3A4454; line-height:1.5; margin-top:8px;}

.rest-bar{position:fixed; left:0; right:0; bottom:0; background:var(--accent); color:#fff; z-index:90;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px rgba(0,0,0,.2);
  display:flex; align-items:center; gap:14px;}
.rest-bar-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.85;}
.rest-bar-time{font-family:var(--font-mono); font-size:26px; font-weight:700;}
.rest-bar-btns{display:flex; gap:8px; margin-left:auto;}
.rest-bar-btn{background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:#fff;
  border-radius:9px; padding:8px 11px; font-size:13px; font-weight:600;}
.rest-bar-btn:active{background:rgba(255,255,255,.32);}

/* PLANIFICACIÓN */
.act-chip{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1.5px solid var(--line);
  border-radius:12px; padding:9px 12px; font-size:13.5px; font-weight:600; white-space:nowrap; touch-action:none; cursor:grab;}
.act-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.bank-grid{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px;}
.act-chip{font-size:12.5px; padding:7px 10px;}
.week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin:6px 0 18px;}
.day-col{background:var(--surface); border:1.5px solid var(--line); border-radius:10px;
  padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; min-height:120px;}
.day-col.over{border-color:var(--accent); background:rgba(31,58,95,.08);}
.day-col.awaiting{border-style:dashed; border-color:var(--accent);}
.act-chip.selected{background:var(--accent); color:#fff; border-width:2px;}
.plan-hint{background:var(--surface-2); border:1px solid var(--accent); border-radius:10px;
  padding:9px 12px; font-size:12.5px; color:var(--accent); font-weight:600; margin-bottom:10px;}

/* PANEL DE ESTADO (últimas 2 semanas) */
.status-card{border:1.5px solid; border-radius:16px; padding:16px; margin-bottom:16px;}
.status-head{display:flex; align-items:center; gap:14px;}
.status-icon{font-size:44px; line-height:1; flex-shrink:0;}
.status-text{flex:1;}
.status-title{font-family:var(--font-display); font-size:19px; font-weight:700; margin-bottom:3px;}
.status-msg{font-size:13.5px; line-height:1.45; color:#3A4454;}
.status-strip{display:flex; gap:4px; margin-top:14px;}
.status-dot{flex:1; height:9px; border-radius:3px; background:rgba(0,0,0,.10);}
.status-dot.today{outline:2px solid rgba(0,0,0,.28); outline-offset:1px;}
.status-stats{display:flex; gap:14px; margin-top:10px; font-size:12px; color:#4A5568;}
.status-stats b{font-size:13.5px;}

.backup-help{background:var(--surface-2); border-radius:10px; padding:11px 13px;
  font-size:12.5px; line-height:1.5; color:#3A4454; margin-bottom:12px;}
.backup-toggle{font-size:12.5px; color:var(--accent); font-weight:600; padding:6px 0;}

.brand{display:flex; align-items:center; gap:12px;}

/* Gatos */
.panic-btn{margin-top:18px; text-align:center; padding:13px; border-radius:14px; font-weight:700; font-size:15px;
  background:#FFF1E6; color:#B4531F; border:1.5px dashed #E8A06E; cursor:pointer; user-select:none;}
.panic-btn:active{transform:scale(.98);}
.panic-box{text-align:center;}
.panic-img-wrap{margin:-4px -4px 12px;}
.panic-img{width:100%; max-height:46vh; object-fit:cover; border-radius:14px; display:block;}
.gato-fallback{font-size:84px; line-height:1.3; background:#FFF1E6; padding:20px 0;}
.panic-bubble{position:relative; background:var(--bg,#F4F6FA); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
  font-size:16px; line-height:1.4; text-align:left;}
.panic-bubble:before{content:""; position:absolute; top:-8px; left:32px; width:14px; height:14px; background:inherit;
  border-left:1px solid var(--line); border-top:1px solid var(--line); transform:rotate(45deg);}
.panic-firma{font-size:13px; color:var(--muted); text-align:right; margin:6px 2px 0; min-height:4px;}
.ua-banner{background:linear-gradient(135deg,#FFF6D6,#E6F0FF); border-radius:14px; padding:12px 14px; margin-bottom:12px; text-align:center;}
.ua-text{font-family:var(--font-display); font-size:21px; font-weight:700; color:#1E3A66;}
.ua-trad{font-size:12.5px; color:var(--muted); margin-top:3px;}
/* Avisos de fase */
.pub-link{color:#0F7C80; font-weight:700; text-decoration:underline; white-space:nowrap;}
.set-nocarga{text-align:center; font-size:13px; color:var(--muted); padding:11px 0;}
.nrm-body{font-size:13.5px; line-height:1.5; color:#3A4454;}
.nrm-body p{margin:0 0 10px;}
.nrm-body ul{margin:0 0 10px; padding-left:18px;}
.nrm-body li{margin-bottom:5px;}
.nrm-h{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#0F7C80; margin:14px 0 6px;}
.nrm-t{width:100%; border-collapse:collapse; margin-bottom:10px; font-size:12.5px;}
.nrm-t td{border-bottom:1px solid var(--line); padding:6px 4px; vertical-align:top;}
.nrm-t td:first-child{font-weight:600; width:44%;}
.seg{display:flex; gap:6px; margin-bottom:10px;}
.seg-btn{flex:1; text-align:center; padding:10px 4px; border-radius:10px; background:var(--surface-2);
  border:1px solid var(--line); font-size:13.5px; font-weight:600; color:#4A5568;}
.seg-btn.on.good{background:#2E8B57; border-color:#2E8B57; color:#fff;}
.seg-btn.on.mid{background:#D4AC0D; border-color:#D4AC0D; color:#fff;}
.seg-btn.on.bad{background:var(--danger); border-color:var(--danger); color:#fff;}
.sint-q{font-size:12.5px; font-weight:600; color:#4A5568; margin:10px 0 6px;}
.sint-ta{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; margin-bottom:6px;}
.sint-hint{font-size:12px; color:#0B5558; background:#E8F5F5; border-radius:8px; padding:8px 10px; margin:6px 0 10px;}
.sint-card{background:var(--surface); border:1.5px solid #0F7C80; border-radius:14px; padding:13px 15px; margin-bottom:12px;}
.sint-card-q{font-size:15px; font-weight:700; margin-bottom:2px;}
.sint-card-sub{font-size:12px; color:var(--muted); margin-bottom:10px;}
.hist-chip.sint-good{background:#EAF6EE; color:#2E8B57;}
.hist-chip.sint-mid{background:#FFF6D6; color:#8A6D00;}
.hist-chip.sint-bad{background:#FDEDEC; color:#A63A31;}
.pub-note{background:#E8F5F5; border:1px solid #9FD0D2; color:#0B5558; border-radius:11px;
  padding:10px 13px; font-size:12.5px; line-height:1.5; margin-bottom:14px;}
.ex-row-ind{font-size:12px; color:#0B5558; margin-top:3px; line-height:1.4;}
.ind-note{background:#E8F5F5; border:1px solid #9FD0D2; color:#0B5558; border-radius:11px;
  padding:9px 12px; font-size:13px; line-height:1.45; margin-top:10px;}
.opt-badge{font-size:9.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
  padding:1px 6px; border-radius:6px; background:#FFF6D6; color:#8A6D00; border:1px solid #EAD58A;}
.alt-btn{margin-top:8px; padding:9px 12px; border-radius:11px; border:1px dashed var(--accent);
  color:var(--accent); font-size:13px; cursor:pointer;}
.brand-logo{width:52px; height:52px; border-radius:13px; flex-shrink:0; object-fit:cover;}

/* ÚLTIMOS ENTRENAMIENTOS (ficha de ejercicio) */
.prev-card{background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:13px 15px; margin-bottom:9px;}
.prev-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.prev-date{font-size:14px; font-weight:700; color:var(--text);}
.prev-tag{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color:#fff; background:var(--accent); border-radius:5px; padding:2px 7px;}
.prev-tag.muted{background:var(--surface-2); color:var(--muted);}
.prev-sets{display:flex; flex-wrap:wrap; gap:6px;}
.prev-set{background:var(--surface-2); border-radius:9px; padding:7px 10px;
  display:flex; align-items:center; gap:8px;}
.prev-set-n{font-size:10.5px; font-weight:700; color:var(--muted);}
.prev-set-val{display:flex; align-items:baseline; gap:4px;}
.prev-reps{font-size:14.5px; font-weight:700; color:var(--text);}
.prev-x{font-size:11px; color:var(--muted);}
.prev-peso{font-size:14.5px; font-weight:700; color:var(--accent);}
.prev-foot{font-size:12px; color:var(--muted); margin-top:10px;}
.prev-foot b{color:var(--text);}
.prev-trend{font-size:12.5px; font-weight:600; border-radius:9px; padding:9px 12px; margin-top:4px;}
.prev-trend.up{background:#EAF6EE; color:#2E8B57;}
.prev-trend.down{background:#FDF1E5; color:#B4661F;}
.prev-trend.same{background:var(--surface-2); color:#4A5568;}

/* HISTORIAL */
.hist-summary{display:flex; gap:8px; margin:16px 0 20px;}
.hist-sum-box{flex:1; background:var(--surface); border:1px solid var(--line);
  border-radius:13px; padding:13px 8px; text-align:center;}
.hist-sum-val{font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--accent);}
.hist-sum-key{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-top:3px;}
.hist-month{font-size:11px; letter-spacing:.13em; text-transform:uppercase; font-weight:700;
  color:var(--muted); margin:20px 0 9px;}
.hist-card{background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin-bottom:9px;}
.hist-card:active{border-color:var(--accent);}
.hist-card-head{display:flex; align-items:flex-start; justify-content:space-between;}
.hist-card-routine{font-size:16px; font-weight:700;}
.hist-card-date{font-size:12.5px; color:var(--muted); margin-top:1px;}
.hist-card-arrow{font-size:22px; color:var(--accent); line-height:1;}
.hist-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.hist-chip{background:var(--surface-2); border-radius:20px; padding:4px 11px;
  font-size:11.5px; font-weight:600; color:#4A5568;}

/* DETALLE DE UN DÍA */
.hd-card{background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin-bottom:10px;}
.hd-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.hd-name{font-size:15.5px; font-weight:700;}
.hd-summary{font-size:12.5px; color:var(--accent); font-weight:600; margin-top:3px;}
.hd-sets{display:flex; flex-direction:column; gap:5px; margin-top:11px;}
.hd-set{display:flex; align-items:center; gap:12px; background:var(--surface-2);
  border-radius:9px; padding:7px 11px;}
.hd-set-n{font-size:10.5px; font-weight:700; color:var(--muted); min-width:20px;}
.hd-set-val{display:flex; align-items:baseline; gap:5px;}
.hd-note{font-size:11.5px; color:var(--muted); font-style:italic; margin-top:9px;}
.day-letter{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;}
.day-num{font-size:15px; font-weight:700; color:var(--text); margin-top:-3px;}
.day-col.today{border-color:var(--accent); background:rgba(31,58,95,.05);}
.day-col.today .day-num{color:var(--accent);}
.week-nav{display:flex; align-items:center; gap:10px; margin:14px 0 4px;}
.week-nav-btn{width:38px; height:38px; border-radius:11px; background:var(--surface);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:20px; color:var(--accent); flex-shrink:0;}
.week-nav-btn:active{border-color:var(--accent); background:var(--surface-2);}
.week-nav-label{flex:1; text-align:center;}
.week-nav-range{font-size:14.5px; font-weight:700;}
.week-nav-rel{font-size:11.5px; color:var(--muted); margin-top:1px;}
.week-today{text-align:center; font-size:12.5px; color:var(--accent); font-weight:600;
  padding:7px; margin-bottom:6px;}
.day-meter{width:9px; height:52px; border-radius:5px; background:var(--surface-2);
  overflow:hidden; display:flex; flex-direction:column-reverse;}
.day-meter-fill{width:100%; border-radius:5px; transition:height .2s;}
.day-col-blocks{display:flex; flex-wrap:wrap; gap:3px; justify-content:center;}
.day-mini{width:11px; height:11px; border-radius:3px; border:1px solid rgba(0,0,0,.12);}
.day-col-warn{font-size:11px;}
.day-detail{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 12px; margin-bottom:7px;}
.day-detail-name{font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; margin-bottom:7px;}
.day-blocks{display:flex; flex-wrap:wrap; gap:6px;}
.day-block{display:flex; align-items:center; gap:6px; border-radius:10px; padding:6px 9px; font-size:12.5px; font-weight:600; color:#fff;}
.day-block-x{opacity:.85; font-weight:700; padding-left:2px;}
.day-warning{font-size:12px; color:#B8860B; margin-top:8px;}
.plan-alert{background:#FDEDEC; border:1px solid #E6A39C; color:#8B3A32; border-radius:12px; padding:12px 14px; font-size:13.5px; margin-bottom:14px;}
.drag-ghost{position:fixed; z-index:300; pointer-events:none; opacity:.9; transform:translate(-50%,-50%);}
.color-swatch{display:inline-block; width:22px; height:22px; border-radius:50%; margin-right:6px; border:2px solid transparent;}
.color-swatch.selected{border-color:var(--accent);}

/* SUPLEMENTACIÓN */
.sup-moment{font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700;

.sup-card{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:11px;

.sup-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}

.sup-del:active{color:var(--danger);}

/* ---------- Datos base (rutina) ---------- */

// al nuevo esquema (grupo[], rirMin/rirMax, ejecucion[], errores[], consejos[], progresion[], observaciones[])
// para que convivan como biblioteca "en la sombra" junto a los nuevos.
function splitSentences(s){
  return (s||"").split(/\.\s+/).map(x=>x.trim().replace(/\.$/,"")).filter(Boolean);
}
function parseDescansoSeg(str){
  if(!str) return 90;
  const m = String(str).match(/(\d+)/g);
  if(!m) return 90;
  if(m.length>=2) return Math.round((parseInt(m[0])+parseInt(m[1]))/2*60); // "2-3 min" -> media en seg
  const n = parseInt(m[0]);
  return /min/i.test(str) ? n*60 : n;
}
function normalizeExercise(e){
  if(e.ficha===false || e.grupo) return e; // ya está en el esquema nuevo, o es un ejercicio "sin ficha" del catálogo
  return {
    id:e.id, nombre:e.nombre,
    grupo:[e.muscPrimario, ...(e.muscSecundario||[])].filter(Boolean),
    series:e.series, repMin:e.repMin, repMax:e.repMax, unidad:"reps", repNota:"",
    rirMin:e.rir, rirMax:e.rir,
    descansoSeg: parseDescansoSeg(e.descanso),
    tipo: (e.muscSecundario && e.muscSecundario.length) ? "compuesto" : "aislamiento",
    descripcion: e.objetivo || "",
    ejecucion: splitSentences(e.tecnica),
    errores: splitSentences(e.errores),
    consejos: splitSentences(e.consejos),
    progresion: [`Cuando completes ${e.repMax} repeticiones en todas las series con buena técnica, sube peso la siguiente sesión y vuelve a ${e.repMin} repeticiones.`],
    observaciones: e.notas ? [e.notas] : []
  };
}

  POT:  {label:"Potencia",                color:"#6B3FA0", desc:"Concéntrica EXPLOSIVA, máxima intención de velocidad. Vuelta/recuperación controlada. Descanso suficiente entre series; si empiezas a perder velocidad, para. Prioriza pocas repeticiones buenas sobre muchas agotado."},
  MOV:  {label:"Movilidad",               color:"#2E8B57", desc:"Lento y controlado, buscando progresivamente el rango disponible, sin rebotes violentos. Respiración tranquila. No debería doler."},
  UNI:  {label:"Unilateral",              color:"#C9A227", desc:"No tiene una velocidad propia: se ejecuta según su objetivo principal (fuerza, potencia o estabilidad), trabajando cada lado de forma independiente."},
  EST:  {label:"Estabilidad / Equilibrio",color:"#B58B00", desc:"Lento y preciso. Prioridad absoluta a la técnica, sin buscar fatiga. Si empiezas a tambalearte demasiado, la serie ha terminado."},
  COR:  {label:"Core",                    color:"#2F5D9F", desc:"El tronco resiste un movimiento indeseado (rotación, inclinación lateral, extensión lumbar...). Generalmente lento y muy controlado."},
  CAR:  {label:"Carry",                   color:"#2F5D9F", desc:"Transportar carga manteniendo una postura sólida: caminar de forma natural, tronco estable, sin balancearse, respiración controlada."},
  COND: {label:"Condicionamiento",        color:"#7A5230", desc:"Ritmo alto y cierto grado de fatiga buscado, con recuperación suficiente entre esfuerzos. No es hipertrofia ni potencia pura."},
  COOR: {label:"Coordinación / Locomoción",color:"#2F5D9F", desc:"Controlado al inicio; después puede aumentar la velocidad manteniendo la coordinación. Prioridad: calidad del patrón, no agotamiento."},

  TEC:  {label:"Técnica y control",       color:"#C97A2B", desc:"Movimiento controlado, con una bajada de unos 2 segundos, sin rebotes ni impulso. Respira de forma continua, sin contener el aire. Si pierdes el control, no subas el peso."},

  const b = el("span","move-badge", code);
  b.style.background = info.color+"1f";
  b.style.color = info.color;

/* Etapas del programa: series y RIR que se aplican a los ejercicios con fase:true */
const PROGRAM_WEEKS = 8;
const PHASES = [
  {desde:1, hasta:2, nombre:"Aprendizaje",   seriesMin:1, series:2, rirMin:4, rirMax:5, nota:"Aprende a ajustar las máquinas, controlar el recorrido y respirar."},
  {desde:3, hasta:4, nombre:"Consolidación", seriesMin:2, series:2, rirMin:3, rirMax:4, nota:"Empieza a subir cargas si la técnica es consistente."},
  {desde:5, hasta:6, nombre:"Desarrollo",    seriesMin:2, series:2, seriesPrincipal:3, rirMin:3, rirMax:3, nota:"3 series opcionales en prensa, press de pecho y remo si recuperas bien."},
  {desde:7, hasta:8, nombre:"Progresión",    seriesMin:2, series:3, rirMin:2, rirMax:3, nota:"Consolida cargas y mejora repeticiones. Sin llegar al fallo."}
];
function programWeek(){
  const ini = DB && DB.settings && DB.settings.programStart;
  if(!ini) return 1;
  const dias = Math.floor((new Date(isoDateStr()) - new Date(ini))/86400000);
  return Math.max(1, Math.floor(dias/7) + 1);
}
function currentPhase(){
  const w = Math.min(programWeek(), PROGRAM_WEEKS);
  return PHASES.find(p=> w>=p.desde && w<=p.hasta) || PHASES[PHASES.length-1];
}
// Aplica series y RIR de la semana. Las semanas son referencia, no obligación.
function phaseOverride(def){
  if(!def || !def.fase) return def;
  const p = currentPhase();
  const d = Object.assign({}, def);
  d.seriesMin = p.seriesMin;
  d.series = (def.principal && p.seriesPrincipal) ? p.seriesPrincipal : p.series;
  d.rirMin = p.rirMin; d.rirMax = p.rirMax;
  return d;
}

/* ---------- Cronómetro inteligente de descanso: category / body_part ---------- */
// Descansos entre series (s). POT/FUE a 120: el SNC se recupera lo suficiente para
// mantener explosividad y técnica, sin enfriarse ni alargar la sesión.
const REST_DICT = {POT:120, FUE:120, HIP:90, COND:90, COR:60, EST:60, MOV:60, REH:60};
function categoryOf(ex){
  if(ex.category) return ex.category;
  const order = ["POT","FUE","HIP","COND","REH","COR","EST","MOV"];
  const codes = ex.tipoMovimiento || [];
  return order.find(c=>codes.includes(c)) || "HIP";
}
function bodyPartOf(ex){
  if(ex.body_part) return ex.body_part;
  const text = ((ex.grupo||[]).join(" ")+" "+ex.nombre).toLowerCase();
  const lower = /(pierna|cuádricep|cuadricep|isquio|glúte|glute|gemelo|sóleo|soleo|cadera|rodilla|tobillo|zancada|sentadilla|squat|salto|jump)/;
  const upper = /(pecho|pectoral|espalda|dorsal|hombro|deltoid|bícep|bicep|trícep|tricep|trapecio|brazo|press militar|dominada|remo|jalón|jalon)/;
  const hasLower = lower.test(text), hasUpper = upper.test(text);
  if(hasLower && !hasUpper) return "Tren Inferior";
  if(hasUpper && !hasLower) return "Tren Superior";
  return "Core/FullBody";
}
Object.values(DEFAULT_EXERCISES).forEach(e=>{

/* El plan es un calendario real: DB.plan["2026-09-08"] = [{instanceId, activityId}].
   Se navega por semanas y se conserva el histórico. */
function startOfWeek(date){
  const d = new Date(date);
  d.setHours(12,0,0,0);                 // mediodía: evita saltos por horario de verano
  const dow = (d.getDay() + 6) % 7;     // 0 = lunes
  d.setDate(d.getDate() - dow);
  return d;
}
function addDays(date, n){
  const d = new Date(date);
  d.setHours(12,0,0,0);
  d.setDate(d.getDate() + n);
  return d;
}
function weekDates(offset){
  const base = addDays(startOfWeek(new Date()), offset*7);
  const out = [];
  for(let i=0;i<7;i++) out.push(addDays(base, i));
  return out;
}
function planKey(date){ return isoDateStr(date); }
function planFor(key){ return (DB.plan && DB.plan[key]) || []; }
function prevKey(key){
  const [y,m,d] = key.split("-").map(Number);
  return planKey(addDays(new Date(y, m-1, d), -1));
}
function formatDayRange(dates){
  const MESES_C = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const a = dates[0], b = dates[6];
  const ma = MESES_C[a.getMonth()], mb = MESES_C[b.getMonth()];
  return a.getDate()+" "+ma+" – "+b.getDate()+" "+mb+" "+b.getFullYear();
}

/* ---------- Suplementación: datos estáticos iniciales ---------- */
const DEFAULT_SUPPLEMENTS = [];
// La clave mantiene el nombre antiguo a propósito: cambiarla haría que la app no
// encontrara los datos ya guardados en dispositivos que venían de la versión anterior.
const STORAGE_KEY = "fase1_gym_db";
const SCHEMA_VERSION = 11; // subir este número cuando se actualice el catálogo/rutina por defecto

/* ---------- Capa de almacenamiento ----------
   window.storage solo existe dentro del entorno de artifacts de Claude. Si la app se abre
   como archivo suelto, desde una URL propia o en cualquier navegador normal, no está,
   así que usamos localStorage. Ambos caminos guardan exactamente lo mismo. */
const Storage = (function(){
  const hasArtifactStorage = typeof window !== "undefined" && window.storage
    && typeof window.storage.get === "function" && typeof window.storage.set === "function";

  function localAvailable(){
    try{
      const k="__fase1_test__";
      window.localStorage.setItem(k,"1");
      window.localStorage.removeItem(k);
      return true;
    }catch(e){ return false; }
  }
  const hasLocal = !hasArtifactStorage && localAvailable();
  const memory = {}; // último recurso: la sesión actual no se pierde aunque no haya disco

  return {
    mode: hasArtifactStorage ? "artifact" : (hasLocal ? "local" : "memoria"),
    persistent: hasArtifactStorage || hasLocal,
    async get(key){
      if(hasArtifactStorage){
        const r = await window.storage.get(key, false);
        return (r && r.value !== undefined) ? r.value : null;
      }
      if(hasLocal) return window.localStorage.getItem(key);
      return memory[key] !== undefined ? memory[key] : null;
    },
    async set(key, value){
      if(hasArtifactStorage){ await window.storage.set(key, value, false); return; }
      if(hasLocal){
        try{
          window.localStorage.setItem(key, value);
        }catch(e){
          // Cuota llena: liberamos copias de seguridad antiguas y reintentamos una vez.
          // Si aun así falla, propagamos para que el usuario reciba el aviso.
          try{
            Object.keys(window.localStorage)
              .filter(k=> k!==key && k.indexOf(STORAGE_KEY)===0)
              .forEach(k=> window.localStorage.removeItem(k));
            window.localStorage.setItem(key, value);
            return;
          }catch(e2){ throw e; }
        }
        return;
      }
      memory[key] = value;
    }
  };
})();

// Rellena lo que falte sin destruir nunca lo que ya existe. Cada bloque va por separado,
// de modo que un fallo puntual no puede tirar abajo el resto de los datos guardados.
function reconcileDB(db){
  const base = freshDB();
  if(!db || typeof db !== "object") return base;

  if(!db.exercises || typeof db.exercises !== "object") db.exercises = base.exercises;
  else {
    Object.keys(db.exercises).forEach(k=>{
      try{ db.exercises[k] = normalizeExercise(db.exercises[k]); }
      catch(e){ delete db.exercises[k]; }
    });
  }
  if(!db.routines || typeof db.routines !== "object") db.routines = base.routines;
  if(!db.settings || typeof db.settings !== "object") db.settings = {programStart:null};
  if(!Array.isArray(db.sessions)) db.sessions = [];
  if(db.draftSession === undefined) db.draftSession = null;
  if(!Array.isArray(db.activities) || db.activities.length===0) db.activities = base.activities;
  if(!Array.isArray(db.supplements)) db.supplements = base.supplements;
  if(!db.planRules || typeof db.planRules !== "object") db.planRules = base.planRules;
  else Object.keys(base.planRules).forEach(k=>{ if(db.planRules[k]===undefined) db.planRules[k]=base.planRules[k]; });

  // El plan semanal se preserva siempre; solo se completan los días que falten.
  if(!db.weekPlan || typeof db.weekPlan !== "object") db.weekPlan = emptyWeekPlan();
  else WEEK_DAYS.forEach(d=>{ if(!Array.isArray(db.weekPlan[d])) db.weekPlan[d] = []; });

  // Calendario por fechas. Si venías de la versión de una sola semana, volcamos
  // aquel plan sobre la semana actual para no perder lo que tuvieras puesto.
  if(!db.plan || typeof db.plan !== "object"){
    db.plan = {};
    const tieneAlgo = WEEK_DAYS.some(d=> (db.weekPlan[d]||[]).length);
    if(tieneAlgo){
      const dates = weekDates(0);
      WEEK_DAYS.forEach((d,i)=>{
        const bloques = db.weekPlan[d] || [];
        if(bloques.length) db.plan[planKey(dates[i])] = bloques.map(b=>({...b}));
      });
    }
  }
  // Limpieza suave: descartamos lo anterior a un año para que no crezca sin límite.
  const limite = planKey(addDays(new Date(), -370));
  Object.keys(db.plan).forEach(k=>{
    if(k < limite || !Array.isArray(db.plan[k]) || db.plan[k].length===0) delete db.plan[k];
  });

  if(!db.schemaVersion) db.schemaVersion = 1;
  if(db.schemaVersion < SCHEMA_VERSION){
    // Refresca SOLO el catálogo de ejercicios de fábrica y las rutinas. Nunca toca
    // sessions, draftSession, weekPlan, activities, planRules ni supplements.
    Object.values(DEFAULT_EXERCISES).forEach(e=>{
      db.exercises[e.id] = normalizeExercise(JSON.parse(JSON.stringify(e)));
    });
    db.routines = JSON.parse(JSON.stringify(DEFAULT_ROUTINES));
    db.schemaVersion = SCHEMA_VERSION;
  }

  // GARANTÍA DE HISTORIAL: cualquier ejercicio que aparezca en una sesión pasada debe
  // seguir existiendo en el catálogo, aunque ya no forme parte de ninguna rutina. Así,
  // al cambiar ejercicios de la rutina, el historial antiguo sigue mostrando su nombre
  // y sus datos en lugar de "Ejercicio eliminado".
  const usados = new Set();
  (db.sessions||[]).forEach(s=> (s.ejercicios||[]).forEach(e=> usados.add(e.exId)));
  if(db.draftSession) (db.draftSession.ejercicios||[]).forEach(e=> usados.add(e.exId));
  usados.forEach(id=>{
    if(db.exercises[id]) return;
    if(DEFAULT_EXERCISES[id]){
      db.exercises[id] = normalizeExercise(JSON.parse(JSON.stringify(DEFAULT_EXERCISES[id])));
    } else {
      // Ni siquiera está en el catálogo de fábrica: creamos una ficha mínima para no
      // perder la referencia en el historial.
      db.exercises[id] = {
        id, nombre:"Ejercicio anterior", grupo:[], series:3, repMin:8, repMax:10,
        unidad:"reps", repNota:"", rirMin:null, rirMax:null, descansoSeg:90, tipo:"",
        descripcion:"", ejecucion:[], errores:[], consejos:[], progresion:[],
        observaciones:["Conservado para que tu historial siga siendo legible."],
        tipoMovimiento:[], objetivo:"", category:"HIP", body_part:"Core/FullBody", archivado:true
      };
    }
    db.exercises[id].archivado = true;
  });

  return db;
}

async function loadDB(){
  let raw = null;
  try{
    raw = await Storage.get(STORAGE_KEY);
  }catch(e){
    // No hay nada guardado todavía (o el almacenamiento falló): arrancamos de fábrica.
    return freshDB();
  }
  if(!raw) return freshDB();

  let parsed = null;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    // Datos corruptos: guardamos una copia por si acaso antes de empezar de cero.
    console.error("Datos corruptos, se conserva copia de seguridad", e);
    try{ await Storage.set(STORAGE_KEY+"_backup_corrupto", raw); }catch(_){}
    return freshDB();
  }
  // Si la reconciliación fallara por algo inesperado, preferimos devolver los datos
  // tal cual estaban antes que descartarlos.
  try{ return reconcileDB(parsed); }
  catch(e){ console.error("Error reconciliando datos, se usan tal cual", e); return parsed; }
}
// Guardado con "debounce": agrupa ráfagas de cambios (teclear, marcar series) en una sola
// escritura, en vez de una por pulsación. Evita saturar el almacenamiento y va mucho más fluido.
let _saveTimer = null, _savePending = false, _saveInFlight = false, _saveQueued = false;
async function saveNow(){
  if(!DB) return;
  if(_saveInFlight){ _saveQueued = true; return; } // evita escrituras solapadas
  _saveInFlight = true;
  _savePending = false;
  if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; }
  try{
    await Storage.set(STORAGE_KEY, JSON.stringify(DB));
  }catch(e){
    console.error("Error guardando datos:", e);
    _savePending = true; // se reintentará en el próximo cambio o al ocultar la app
    toast(Storage.persistent ? "No se pudo guardar, se reintentará" : "Sin almacenamiento disponible");
  }finally{
    _saveInFlight = false;
    if(_saveQueued){ _saveQueued = false; saveNow(); }
  }
}
function saveDB(){
  _savePending = true;
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveNow, 400);
}
// En móvil la app puede "morir" sin previo aviso al cambiar de aplicación, así que en cuanto
// se oculta forzamos el guardado pendiente en lugar de esperar al debounce.
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && _savePending) saveNow(); });
window.addEventListener("pagehide", ()=>{ if(_savePending) saveNow(); });
window.addEventListener("blur", ()=>{ if(_savePending) saveNow(); });

function isoDateStr(d){

// Las sesiones antiguas solo guardaban "DD/MM/YYYY"; lo convertimos para poder comparar.
function sessionISO(s){
  if(s.iso) return s.iso;
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s.fecha||"");
  return m ? (m[3]+"-"+m[2]+"-"+m[1]) : null;
}
function daysAgoISO(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return isoDateStr(d);
}

/* ---------- Formato legible de una serie ---------- */
// Devuelve las dos mitades por separado para poder darles estilo distinto.
function setParts(def, set){
  const unidad = (def && def.unidad) || "reps";
  const carga = (set.peso===""||set.peso==null) ? null : set.peso;
  let repTxt;
  if(unidad==="segundos") repTxt = set.reps+" s";
  else if(unidad==="m")   repTxt = set.reps+" m";
  else if(unidad==="min") repTxt = set.reps+" min";
  else                    repTxt = set.reps+" rep";
  const cargaTxt = carga===null ? null : (carga+" kg");
  return {repTxt, cargaTxt};
}
function setText(def, set){
  const p = setParts(def, set);
  return p.cargaTxt ? (p.repTxt+" × "+p.cargaTxt) : p.repTxt;
}
// Resumen de una lista de series: "3×8 rep · 100 kg" o "8, 8, 7 rep · 100 kg"
function seriesSummary(def, series){
  if(!series.length) return "";
  const reps = series.map(s=>s.reps);
  const pesos = series.map(s=>s.peso).filter(p=>p!==""&&p!=null);
  const unidad = (def && def.unidad) || "reps";
  const uTxt = unidad==="segundos" ? "s" : unidad==="m" ? "m" : unidad==="min" ? "min" : "rep";
  const mismasReps = reps.every(r=>r===reps[0]);
  const repPart = mismasReps ? (series.length+"×"+reps[0]+" "+uTxt) : (reps.join(", ")+" "+uTxt);
  if(!pesos.length) return repPart;
  const mismoPeso = pesos.every(p=>p===pesos[0]);
  const pesoPart = mismoPeso ? (pesos[0]+" kg") : (pesos.join("/")+" kg");
  return repPart+" · "+pesoPart;
}
// Acepta lo que escriba el usuario y lo deja en un número válido.
// Convierte la coma decimal española en punto y descarta cualquier otro carácter.
function cleanNumberInput(valor, permitirDecimales){
  let v = String(valor).replace(",", ".");
  v = permitirDecimales ? v.replace(/[^0-9.]/g, "") : v.replace(/[^0-9]/g, "");
  if(permitirDecimales){
    const partes = v.split(".");
    if(partes.length > 2) v = partes[0] + "." + partes.slice(1).join(""); // un solo punto
  }
  return v;
}
// Parseo tolerante: nunca devuelve NaN, acepta coma o punto.
function num(valor){
  const n = parseFloat(String(valor).replace(",", "."));
  return isFinite(n) ? n : 0;
}
function volumenSerie(set){
  const p = num(set.peso), r = num(set.reps);
  return p*r;
}

/* ---------- Análisis de las últimas 2 semanas ---------- */
function analyzeLastTwoWeeks(){
  // dias[0] es el más antiguo y dias[13] es hoy. Calculamos las fechas UNA vez
  // y usamos conjuntos para las búsquedas, en vez de recorrer listas por cada sesión.
  const dias = [];
  for(let i=13; i>=0; i--) dias.push(daysAgoISO(i));
  const ventana = new Set(dias);
  const hace = (i)=> dias[13-i]; // i días atrás (0 = hoy)

  const entrenados = new Set();
  (DB.sessions||[]).forEach(s=>{
    const iso = sessionISO(s);
    if(iso && ventana.has(iso)) entrenados.add(iso);
  });

  const total = entrenados.size;

  // Racha actual de días seguidos entrenando (hasta hoy o ayer)
  let seguidos = 0;
  for(let i=0; i<14; i++){
    if(entrenados.has(hace(i))) seguidos++;
    else break;
  }
  // Días consecutivos SIN entrenar
  let sinEntrenar = 0;
  for(let i=0; i<14; i++){
    if(!entrenados.has(hace(i))) sinEntrenar++;
    else break;
  }
  // Entrenamientos en los últimos 7 días
  let ultimos7 = 0;
  for(let i=0; i<7; i++) if(entrenados.has(hace(i))) ultimos7++;

  // ¿Descansos bien repartidos? Nunca más de 3 días seguidos entrenando en las 2 semanas
  let maxSeguidos = 0, run = 0;
  dias.forEach(d=>{ if(entrenados.has(d)){ run++; maxSeguidos = Math.max(maxSeguidos, run); } else run = 0; });
  const descansosOk = maxSeguidos <= 3;

  // Constancia: al menos un entrenamiento en cada una de las dos semanas
  const sem1 = dias.slice(0,7).filter(d=>entrenados.has(d)).length;
  const sem2 = dias.slice(7).filter(d=>entrenados.has(d)).length;
  const constante = sem1>0 && sem2>0;

  // --- Decidir el estado ---
  let estado;
  if(seguidos >= 4 || ultimos7 >= 6){
    estado = {
      clave:"descanso", icono:"🛌", titulo:"Toca descansar",
      mensaje: seguidos>=4
        ? "Llevas "+seguidos+" días seguidos entrenando. Un día de descanso ahora te hará rendir más, no menos."
        : "Has entrenado "+ultimos7+" de los últimos 7 días. Meter un día en blanco protege tendones y sistema nervioso.",
      color:"#C0504D", fondo:"#FDEDEC"
    };
  } else if(total >= 7 && descansosOk && constante){
    estado = {
      clave:"copa", icono:"🏆", titulo:"¡Estás en racha!",
      mensaje: total+" entrenamientos en 2 semanas, con los descansos bien repartidos. Esto es exactamente lo que buscabas.",
      color:"#B8860B", fondo:"#FFF8E1"
    };
  } else if(total >= 5 && constante){
    estado = {
      clave:"estrella", icono:"⭐", titulo:"Muy buen ritmo",
      mensaje: total+" entrenamientos en 2 semanas. Mantén esta constancia y llegas a la copa.",
      color:"#2E8B57", fondo:"#EAF6EE"
    };
  } else if(total >= 2){
    estado = {
      clave:"progreso", icono:"💪", titulo:"Vas avanzando",
      mensaje: total+" entrenamientos en 2 semanas. Con uno o dos más por semana entras en zona buena.",
      color:"#1F3A5F", fondo:"#EAEEF5"
    };
  } else if(total === 0 && (DB.sessions||[]).length > 0){
    estado = {
      clave:"vuelta", icono:"🔄", titulo:"Hora de volver",
      mensaje: sinEntrenar>=14 ? "Han pasado más de 2 semanas. Empieza suave: el Día 2 de movilidad es un buen reenganche."
                               : "Llevas "+sinEntrenar+" días sin entrenar. Retomar hoy cuesta menos que mañana.",
      color:"#D97B29", fondo:"#FDF1E5"
    };
  } else {
    estado = {
      clave:"empezar", icono:"👟", titulo:"Empecemos",
      mensaje:"Registra tu primer entrenamiento y aquí verás tu progreso de las últimas 2 semanas.",
      color:"#1F3A5F", fondo:"#EAEEF5"
    };
  }

  return {dias, entrenados, total, seguidos, sinEntrenar, ultimos7, maxSeguidos, descansosOk, constante, estado};
}

function exerciseMetaLabel(e){
  if(e.ficha===false) return `${e.grupoMuscular} · ${e.subgrupo} · ${e.tipoEntrenamiento}`;

/* ---------- Helpers de sesión activa ---------- */
/* Ficha efectiva de un ejercicio dentro de una rutina concreta: la base del catálogo
   más los ajustes de volumen/tipo que esa rutina defina (overrides). El historial
   sigue ligado al id del ejercicio, así que se comparte entre rutinas. */
function effDef(exId, routineId){ return phaseOverride(effDefRaw(exId, routineId)); }
function effDefRaw(exId, routineId){
  const base = DB.exercises[exId];
  if(!base) return null;
  const r = routineId && DB.routines[routineId];
  const ov = r && r.overrides && r.overrides[exId];
  if(!ov) return base;
  const merged = Object.assign({}, base, ov);
  if(ov.tipoMovimiento && !ov.category){
    merged.category = categoryOf({tipoMovimiento: ov.tipoMovimiento});
  }
  return merged;
}

// Descanso entre series: el fijo de la pauta si lo hay; si no, el de la categoría.
function restBetweenSets(def){
  if(def.restSeg!=null) return def.restSeg;
  return REST_DICT[categoryOf(def)] || 90;
}
function rangoTxt(a,b){ return (a==null||a===b) ? String(b) : a+"-"+b; }
function seriesTxt(def){
  const n = rangoTxt(def.seriesMin, def.series);
  return n + (n==="1" ? " serie" : " series");
}
function descansoTxt(def){
  if(def.descansoTxt) return def.descansoTxt;
  const sg = restBetweenSets(def); // lo mismo que usará el cronómetro
  return (sg>=120 && sg%60===0) ? (sg/60)+" min" : sg+" s";
}
function visibleRoutines(){
  return Object.values(DB.routines);
}
function curDef(exId){
  return effDef(exId, ACTIVE_SESSION ? ACTIVE_SESSION.routineId : null);
}

function getOrCreateSessionExercise(exId){
  if(!ACTIVE_SESSION) return null;
  let se = ACTIVE_SESSION.ejercicios.find(e=>e.exId===exId);
  if(!se){
    const def = curDef(exId);
    const seriesCount = def.series || 3;
    const fijo = (def.prefill && def.repMin===def.repMax) ? String(def.repMin) : "";
    se = {exId, series: Array.from({length:seriesCount}, ()=>({peso:"",reps:fijo,done:false}))};
    ACTIVE_SESSION.ejercicios.push(se);
  }
  return se;
}

function getLastSessionsFor(exId, excludeSessionId, n){
  const found = [];
  for(let i=DB.sessions.length-1; i>=0 && found.length<n; i--){
    const s = DB.sessions[i];
    if(s.id===excludeSessionId) continue;
    const se = s.ejercicios.find(e=>e.exId===exId);
    if(se && se.series.some(x=>x.done)){
      found.push({fecha:s.fecha, series:se.series.filter(x=>x.done)});
    }
  }
  return found;
}

function isExerciseDoneInSession(exId){
  if(!ACTIVE_SESSION) return false;
  const se = ACTIVE_SESSION.ejercicios.find(e=>e.exId===exId);
  return !!se && se.series.length>0 && se.series.every(s=>s.done);
}

/* ---------- Render raíz ---------- */
const SCREENS = {
  home: ()=>renderHome(), workout: ()=>renderWorkout(), exercise: ()=>renderExercise(),
  history: ()=>renderHistory(), historyDay: ()=>renderHistoryDay(), editor: ()=>renderEditor(),
  editExercise: ()=>renderEditExercise(), legend: ()=>renderLegend(),
  planning: ()=>renderPlanning(), supplements: ()=>renderSupplements()
};
let _rendering = false;
function render(){
  const app = document.getElementById("app");
  if(!app || !DB) return;
  // Evita reentradas: si una acción dentro de un render vuelve a llamar a render(),
  // el DOM se quedaría a medio construir.
  if(_rendering) return;
  _rendering = true;
  try{
    const fn = SCREENS[VIEW.screen] || SCREENS.home;
    const view = fn();
    app.innerHTML = "";
    app.appendChild(view);
  }catch(err){
    // Un fallo al pintar una pantalla no debe dejar la app en blanco ni perder datos:
    // avisamos y volvemos al inicio, que siempre es seguro.
    console.error("Error al renderizar", VIEW, err);
    app.innerHTML = "";
    const box = el("div");
    box.appendChild(el("div","plan-alert","Ha ocurrido un error mostrando esta pantalla. Tus datos están a salvo."));
    const btn = el("div","save-btn","Volver al inicio");
    btn.onclick = ()=>{ VIEW={screen:"home"}; render(); };
    box.appendChild(btn);
    app.appendChild(box);
  }finally{
    _rendering = false;
  }
  renderRestTimer();
}

function el(tag, cls, html){

  if(html!==undefined) e.innerHTML = html;

}

      });
      block.appendChild(grid);

      const vol = h.series.reduce((a,s)=>a+volumenSerie(s),0);
      if(vol>0){
        block.appendChild(el("div","prev-foot","Volumen total: <b>"+Math.round(vol)+" kg</b>"));
      }
      sec2.appendChild(block);
    });

    // Comparativa rápida entre las dos últimas sesiones
    if(last.length===2){
      const v0 = last[0].series.reduce((a,s)=>a+volumenSerie(s),0);
      const v1 = last[1].series.reduce((a,s)=>a+volumenSerie(s),0);
      if(v0>0 && v1>0){
        const diff = v0 - v1;
        const pct = Math.round(Math.abs(diff)/v1*100);
        let txt, cls;
        if(diff>0){ txt = "↗ Subiste un "+pct+"% de volumen respecto a la sesión anterior"; cls="up"; }
        else if(diff<0){ txt = "↘ Bajaste un "+pct+"% de volumen respecto a la sesión anterior"; cls="down"; }
        else { txt = "→ Mismo volumen que la sesión anterior"; cls="same"; }
        sec2.appendChild(el("div","prev-trend "+cls, txt));
      }
    }
  }
  wrap.appendChild(sec2);

  /* 3. Progresión (solo si el ejercicio tiene ficha) */
  if(def.ficha!==false){
  const sec3 = el("div","section");
  sec3.appendChild(el("div","section-label","Progresión"));
  const pcard = el("div","progress-card");
  const rirGoalTxt = (def.rirMin!=null && def.rirMax!=null) ? ` · RIR ${rangoTxt(def.rirMin,def.rirMax)}` : "";
  const notaGoalTxt = def.repNota ? " "+def.repNota : "";
  pcard.appendChild(el("div","progress-goal", `Pauta: <b>${rangoTxt(def.seriesMin,def.series)} × ${rangoTxt(def.repMin,def.repMax)} ${def.unidad||'reps'}${notaGoalTxt}</b>${rirGoalTxt} · descanso ${descansoTxt(def)}`));
  (def.progresion||[]).forEach(txt=>{
    const rule = el("div","progress-rule rule-up");
    rule.appendChild(el("div","rule-dot"));
    rule.appendChild(el("div","rule-text","<span>"+txt+"</span>"));
    pcard.appendChild(rule);
  });
  sec3.appendChild(pcard);
  wrap.appendChild(sec3);

  /* 4. Información */
  const sec4 = el("div","section");
  sec4.appendChild(el("div","section-label","Información del ejercicio"));
  const info = el("div","progress-card");
  function listBlock(h, arr){
    if(!arr || arr.length===0) return null;
    const it = el("div","info-item");
    it.appendChild(el("div","info-h",h));
    it.appendChild(el("div","info-p", arr.map(x=>"• "+x).join("<br>")));
    return it;
  }
  if(def.tipo){
    const it = el("div","info-item");
    it.appendChild(el("div","info-h","Tipo"));
    it.appendChild(el("div","info-p", def.tipo.charAt(0).toUpperCase()+def.tipo.slice(1)));
    info.appendChild(it);
  }
  if(def.descripcion){
    const it = el("div","info-item");
    it.appendChild(el("div","info-h","Descripción"));
    it.appendChild(el("div","info-p", def.descripcion));
    info.appendChild(it);
  }
  [["Cómo colocarse / ejecutar", def.ejecucion], ["Errores comunes", def.errores], ["Consejos", def.consejos]].forEach(([h,arr])=>{
    const block = listBlock(h, arr);
    if(block) info.appendChild(block);
  });
  const musc = el("div","info-item");
  musc.appendChild(el("div","info-h","Músculos implicados"));
  const tags = el("div","muscle-tags");
  (def.grupo||[]).forEach((m,i)=> tags.appendChild(el("div","mtag"+(i===0?" primary":""), m)));
  musc.appendChild(tags);
  info.appendChild(musc);
  const obsBlock = listBlock("Observaciones", def.observaciones);
  if(obsBlock) info.appendChild(obsBlock);
  sec4.appendChild(info);
  wrap.appendChild(sec4);
  } // fin if(def.ficha!==false)

  return wrap;
}

/* ---------- PLANIFICACIÓN SEMANAL (drag & drop táctil propio) ---------- */
const COLOR_HEX = {rojo:"#C0504D", naranja:"#D97B29", amarillo:"#D4AC0D", verde:"#2E8B57", blanco:"#B7BEC9"};

function actById(id){ return DB.activities.find(a=>a.id===id); }

function pointsForDay(key){
  return planFor(key).reduce((sum,b)=>{ const a=actById(b.activityId); return sum+(a?a.puntos:0); },0);
}
function dayHasColor(key, color){
  return planFor(key).some(b=>{ const a=actById(b.activityId); return a && a.color===color; });
}
function dayHasPlyo(key){
  return planFor(key).some(b=>{ const a=actById(b.activityId); return a && a.plyo; });
}
// El límite baja si el día ANTERIOR del calendario tuvo una actividad roja,
// aunque ese día pertenezca a la semana previa.
function effectiveLimitForDay(key){
  if(DB.planRules.noConsecutiveRed && dayHasColor(prevKey(key), "rojo")){
    return DB.planRules.redConsecutiveLimit;
  }
  return DB.planRules.dailyLimit;
}
// Aviso de falta de descanso referido a la semana que estás viendo.
function weekNeedsRestWarning(dates){
  if(!DB.planRules.requireRestDay) return false;
  return dates.every(d=> pointsForDay(planKey(d)) > 0);
}
function tendonWarning(key){
  return dayHasColor(prevKey(key), "naranja") && dayHasPlyo(key);
}
function addActivityToDay(key, activityId){
  const act = actById(activityId);
  if(!act) return;
  const actual = pointsForDay(key);
  const limite = effectiveLimitForDay(key);
  if(actual + act.puntos > limite){
    toast("Sobrecarga: ese día supera el límite de "+limite+" puntos");
    return;
  }
  if(!DB.plan[key]) DB.plan[key] = [];
  DB.plan[key].push({instanceId:uid(), activityId});
  saveDB(); render();
}
function removeFromDay(key, instanceId){
  if(!DB.plan[key]) return;
  DB.plan[key] = DB.plan[key].filter(b=>b.instanceId!==instanceId);
  if(DB.plan[key].length===0) delete DB.plan[key];
  saveDB(); render();
}

// Drag táctil propio (el drag&drop nativo de HTML5 no funciona en Safari iOS)
let PLAN_DRAG = {active:false, activityId:null, ghostEl:null, moved:false};
let PLAN_SELECTED = null; // alternativa al arrastre: tocar actividad y luego un día
function planDragStart(activityId, clientX, clientY){
  const act = DB.activities.find(a=>a.id===activityId);
  if(!act) return;
  PLAN_DRAG.active = true; PLAN_DRAG.activityId = activityId; PLAN_DRAG.moved = false;
  const ghost = document.createElement("div");
  ghost.className = "act-chip drag-ghost";
  ghost.style.left = clientX+"px"; ghost.style.top = clientY+"px";
  ghost.style.borderColor = COLOR_HEX[act.color];
  ghost.innerHTML = "<span class='act-dot' style='background:"+COLOR_HEX[act.color]+"'></span>"+act.nombre;
  document.body.appendChild(ghost);
  PLAN_DRAG.ghostEl = ghost;
}
function dayColAt(clientX, clientY){
  if(typeof document.elementFromPoint !== "function") return null;
  const elAt = document.elementFromPoint(clientX, clientY);
  return (elAt && elAt.closest) ? elAt.closest(".day-col") : null;
}
function planDragMove(clientX, clientY){
  if(!PLAN_DRAG.active) return;
  PLAN_DRAG.moved = true;
  if(PLAN_DRAG.ghostEl){ PLAN_DRAG.ghostEl.style.left=clientX+"px"; PLAN_DRAG.ghostEl.style.top=clientY+"px"; }
  const target = dayColAt(clientX, clientY);
  document.querySelectorAll(".day-col").forEach(c=> c.classList.toggle("over", c===target));
}
function planDragEnd(clientX, clientY){
  if(!PLAN_DRAG.active) return;
  const activityId = PLAN_DRAG.activityId;
  const moved = PLAN_DRAG.moved;
  let target = null;
  try{ target = dayColAt(clientX, clientY); }catch(e){ /* ignorado: soltamos sin destino */ }
  // Limpiamos SIEMPRE el estado, pase lo que pase, para no dejar el arrastre colgado.
  if(PLAN_DRAG.ghostEl && PLAN_DRAG.ghostEl.remove) PLAN_DRAG.ghostEl.remove();
  document.querySelectorAll(".day-col").forEach(c=>c.classList.remove("over"));
  PLAN_DRAG.active=false; PLAN_DRAG.activityId=null; PLAN_DRAG.ghostEl=null; PLAN_DRAG.moved=false;
  if(target && activityId){ PLAN_SELECTED=null; addActivityToDay(target.dataset.day, activityId); return; }
  // Si fue un toque sin arrastrar (o el arrastre no encontró destino), lo tratamos como
  // "seleccionar actividad": luego basta con tocar el día donde quieres ponerla.
  if(!moved && activityId){
    PLAN_SELECTED = (PLAN_SELECTED===activityId) ? null : activityId;
    render();
    if(PLAN_SELECTED){
      const act = DB.activities.find(a=>a.id===PLAN_SELECTED);
      toast("Ahora toca el día para "+(act?act.nombre:"la actividad"));
    }
  }
}
// Si el gesto se cancela (llamada entrante, gesto del sistema...), no dejamos basura en pantalla.
document.addEventListener("touchcancel", ()=>{
  if(!PLAN_DRAG.active) return;
  if(PLAN_DRAG.ghostEl && PLAN_DRAG.ghostEl.remove) PLAN_DRAG.ghostEl.remove();
  document.querySelectorAll(".day-col").forEach(c=>c.classList.remove("over"));
  PLAN_DRAG.active=false; PLAN_DRAG.activityId=null; PLAN_DRAG.ghostEl=null;
});
document.addEventListener("mousemove", (e)=> planDragMove(e.clientX, e.clientY));
document.addEventListener("mouseup", (e)=> planDragEnd(e.clientX, e.clientY));
document.addEventListener("touchmove", (e)=>{ if(PLAN_DRAG.active){ e.preventDefault(); const t=e.touches[0]; planDragMove(t.clientX,t.clientY); } }, {passive:false});
document.addEventListener("touchend", (e)=>{ if(PLAN_DRAG.active){ const t=e.changedTouches[0]; planDragEnd(t.clientX,t.clientY); } });

let PLAN_WEEK = 0; // 0 = semana actual, -1 anterior, +1 siguiente

function renderPlanning(){
  const wrap = el("div");
  const top = el("div","topbar");
  const back = el("div","back","‹ Volver");
  back.onclick = ()=>{ VIEW={screen:"home"}; render(); };
  top.appendChild(back);
  const gear = el("div","back","⚙️ Reglas");
  gear.onclick = ()=> showPlanRulesModal();
  top.appendChild(gear);
  wrap.appendChild(top);
  wrap.appendChild(el("h1","title","Planificación"));

  const dates = weekDates(PLAN_WEEK);
  const hoyKey = planKey(new Date());

  // Navegación entre semanas
  const nav = el("div","week-nav");
  const prev = el("div","week-nav-btn","‹");
  prev.onclick = ()=>{ PLAN_WEEK--; render(); };
  const next = el("div","week-nav-btn","›");
  next.onclick = ()=>{ PLAN_WEEK++; render(); };
  const label = el("div","week-nav-label");
  label.appendChild(el("div","week-nav-range", formatDayRange(dates)));
  const rel = PLAN_WEEK===0 ? "Esta semana"
            : PLAN_WEEK===1 ? "Semana que viene"
            : PLAN_WEEK===-1 ? "Semana pasada"
            : (PLAN_WEEK>0 ? "En "+PLAN_WEEK+" semanas" : "Hace "+Math.abs(PLAN_WEEK)+" semanas");
  label.appendChild(el("div","week-nav-rel", rel));
  nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next);
  wrap.appendChild(nav);

  if(PLAN_WEEK!==0){
    const hoyBtn = el("div","week-today","Ir a esta semana");
    hoyBtn.onclick = ()=>{ PLAN_WEEK = 0; render(); };
    wrap.appendChild(hoyBtn);
  }

  if(weekNeedsRestWarning(dates)){
    wrap.appendChild(el("div","plan-alert","⚠️ Falta descanso: los 7 días de esta semana tienen actividad. Deja al menos uno vacío."));
  }

  // Banco de actividades
  const bank = el("div","bank-grid");
  DB.activities.forEach(act=>{
    const chip = el("div","act-chip"+(PLAN_SELECTED===act.id?" selected":""));
    chip.style.borderColor = COLOR_HEX[act.color];
    chip.innerHTML = "<span class='act-dot' style='background:"+COLOR_HEX[act.color]+"'></span>"+act.nombre;
    chip.onmousedown = (e)=> planDragStart(act.id, e.clientX, e.clientY);
    chip.addEventListener("touchstart", (e)=>{ e.preventDefault(); const t=e.touches[0]; planDragStart(act.id, t.clientX, t.clientY); }, {passive:false});
    bank.appendChild(chip);
  });
  wrap.appendChild(bank);
  if(PLAN_SELECTED){
    wrap.appendChild(el("div","plan-hint","👆 Toca el día donde quieres añadirla (o toca la actividad otra vez para cancelar)"));
  }
  const addActBtn = el("div","add-ex-btn","+ Crear nueva actividad");
  addActBtn.onclick = ()=> showActivityFormModal();
  wrap.appendChild(addActBtn);

  // Rejilla de 7 columnas con fecha real
  const grid = el("div","week-grid");
  dates.forEach((fecha,idx)=>{
    const key = planKey(fecha);
    const col = el("div","day-col"+(PLAN_SELECTED?" awaiting":"")+(key===hoyKey?" today":""));
    col.dataset.day = key;
    col.onclick = ()=>{
      if(!PLAN_SELECTED) return;
      const chosen = PLAN_SELECTED;
      PLAN_SELECTED = null;
      addActivityToDay(key, chosen);
    };
    const limite = effectiveLimitForDay(key);
    const pts = pointsForDay(key);

    col.appendChild(el("div","day-letter", DAY_LETTERS[idx]));
    col.appendChild(el("div","day-num", String(fecha.getDate())));

    const meter = el("div","day-meter");
    const fill = el("div","day-meter-fill");
    const ratio = Math.min(1, limite>0 ? pts/limite : 0);
    fill.style.height = (ratio*100)+"%";
    fill.style.background = ratio>=1 ? "var(--danger)" : "var(--accent)";
    meter.appendChild(fill);
    col.appendChild(meter);

    const blocks = el("div","day-col-blocks");
    planFor(key).forEach(b=>{
      const act = actById(b.activityId);
      if(!act) return;
      const dot = el("div","day-mini");
      dot.style.background = COLOR_HEX[act.color];
      dot.title = act.nombre;
      dot.onclick = (ev)=>{ ev.stopPropagation(); removeFromDay(key, b.instanceId); };
      blocks.appendChild(dot);
    });
    col.appendChild(blocks);
    if(tendonWarning(key)) col.appendChild(el("div","day-col-warn","⚠️"));
    grid.appendChild(col);
  });
  wrap.appendChild(grid);

  // Detalle de los días con actividad de esta semana
  let algo = false;
  dates.forEach((fecha,idx)=>{
    const key = planKey(fecha);
    const bloques = planFor(key);
    if(!bloques.length) return;
    algo = true;
    const row = el("div","day-detail");
    const nombre = WEEK_DAYS[idx]+" "+fecha.getDate();
    const head = el("div","day-detail-name", nombre + (key===hoyKey ? " · hoy" : ""));
    row.appendChild(head);
    const list = el("div","day-blocks");
    bloques.forEach(b=>{
      const act = actById(b.activityId);
      if(!act) return;
      const block = el("div","day-block");
      block.style.background = COLOR_HEX[act.color];
      if(act.color==="blanco" || act.color==="amarillo") block.style.color = "#2b2b2b";
      block.appendChild(el("span",null, act.nombre));
      const x = el("span","day-block-x","✕");
      x.onclick = ()=> removeFromDay(key, b.instanceId);
      block.appendChild(x);
      list.appendChild(block);
    });
    row.appendChild(list);
    if(tendonWarning(key)){
      row.appendChild(el("div","day-warning","⚠️ Tendones: el día anterior hubo Naranja y hoy hay potencia/pliometría. Considera intercalar un día Verde o Blanco."));
    }
    wrap.appendChild(row);
  });
  if(!algo){
    wrap.appendChild(el("div","empty-note","Semana vacía. Arrastra actividades del banco a un día, o tócalas y luego toca el día."));
  }

  return wrap;
}

/* ---------- COPIA DE SEGURIDAD (archivo para iCloud Drive) ---------- */
function backupFileName(){
  const d = new Date();
  const p = n=> String(n).padStart(2,"0");
  return "GymLog-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+".json";
}

function exportBackupFile(){
  try{
    const datos = JSON.stringify(DB, null, 2);
    const blob = new Blob([datos], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = backupFileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    toast("Elige \"Guardar en Archivos\" → iCloud Drive");
  }catch(e){
    console.error(e);
    toast("No se pudo crear el archivo");
  }
}

function importBackupFile(onDone){
  const input = document.createElement("input");
  input.type = "file";
  // .json y también genéricos, porque iOS a veces no reconoce la extensión
  input.accept = "application/json,.json,text/plain";
  input.style.display = "none";
  input.onchange = ()=>{
    const file = input.files && input.files[0];
    if(!file){ input.remove(); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      let parsed;
      try{ parsed = JSON.parse(String(reader.result)); }
      catch(e){ toast("Ese archivo no es una copia válida"); input.remove(); return; }
      if(!parsed || typeof parsed !== "object" || (!parsed.exercises && !parsed.sessions && !parsed.weekPlan && !parsed.plan)){
        toast("Ese archivo no parece una copia de GymLog"); input.remove(); return;
      }
      const nSes = Array.isArray(parsed.sessions) ? parsed.sessions.length : 0;
      showConfirmModal("Restaurar copia",
        "El archivo contiene "+nSes+" entrenamiento"+(nSes===1?"":"s")+". Se sustituirán TODOS los datos actuales. ¿Continuar?",
        "Restaurar", ()=>{
          try{
            DB = reconcileDB(parsed);
            saveNow();
            VIEW = {screen:"home"};
            render();
            toast("Copia restaurada");
            if(onDone) onDone();
          }catch(e){ console.error(e); toast("No se pudo restaurar"); }
        });
      input.remove();
    };
    reader.onerror = ()=>{ toast("No se pudo leer el archivo"); input.remove(); };
    reader.readAsText(file);
  };
  document.body.appendChild(input);
  input.click();
}

/* ---------- HISTORY ---------- */
const HISTORY_PAGE = 30;
let HISTORY_LIMIT = HISTORY_PAGE;
let _histTotals = {firma:null, series:0, vol:0};

function sessionStats(s){
  let series=0, vol=0, ejercicios=0;
  (s.ejercicios||[]).forEach(e=>{
    const hechas = (e.series||[]).filter(x=>x.done);
    if(hechas.length) ejercicios++;
    series += hechas.length;
    hechas.forEach(x=> vol += volumenSerie(x));
  });
  return {series, vol:Math.round(vol), ejercicios};
}

function renderHistory(){
  const wrap = el("div");
  const top = el("div","topbar");
  const back = el("div","back","‹ Volver");
  back.onclick = ()=>{ VIEW={screen:"home"}; render(); };
  top.appendChild(back);
  wrap.appendChild(top);
  wrap.appendChild(el("h1","title","Historial"));

  if(!DB.sessions.length){
    wrap.appendChild(el("div",null,"<div style='height:16px'></div>"));
    wrap.appendChild(el("div","empty-note","Todavía no has completado ningún entrenamiento."));
    return wrap;
  }

  // Resumen global (memorizado: recalcularlo en cada render es caro con muchas sesiones)
  const totalSes = DB.sessions.length;
  const firma = totalSes + ":" + (totalSes ? DB.sessions[totalSes-1].id : "");
  if(_histTotals.firma !== firma){
    let ts=0, tv=0;
    DB.sessions.forEach(s=>{ const st=sessionStats(s); ts+=st.series; tv+=st.vol; });
    _histTotals = {firma, series:ts, vol:tv};
  }
  const totalSeries = _histTotals.series, totalVol = _histTotals.vol;
  const resumen = el("div","hist-summary");
  [["Entrenamientos", totalSes], ["Series", totalSeries], ["Volumen", Math.round(totalVol/1000)+" t"]]
    .forEach(([k,v])=>{
      const b = el("div","hist-sum-box");
      b.appendChild(el("div","hist-sum-val", String(v)));
      b.appendChild(el("div","hist-sum-key", k));
      resumen.appendChild(b);
    });
  wrap.appendChild(resumen);

  // Agrupado por mes. Solo pintamos un bloque cada vez: con muchos entrenamientos
  // acumulados, dibujar cientos de tarjetas de golpe ralentiza la apertura.
  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const visibles = HISTORY_LIMIT;
  const porMes = new Map();
  [...DB.sessions].reverse().slice(0, visibles).forEach(s=>{
    const iso = sessionISO(s);
    let clave = "Sin fecha";
    if(iso){
      const [y,m] = iso.split("-");
      clave = MESES[parseInt(m,10)-1]+" "+y;
    }
    if(!porMes.has(clave)) porMes.set(clave, []);
    porMes.get(clave).push(s);
  });

  porMes.forEach((sesiones, mes)=>{
    wrap.appendChild(el("div","hist-month", mes));
    sesiones.forEach(s=>{
      const st = sessionStats(s);
      const card = el("div","hist-card");
      const head = el("div","hist-card-head");
      const izq = el("div");
      izq.appendChild(el("div","hist-card-routine", s.routineName));
      izq.appendChild(el("div","hist-card-date", s.fecha));
      head.appendChild(izq);
      head.appendChild(el("div","hist-card-arrow","›"));
      card.appendChild(head);

      const chips = el("div","hist-chips");
      chips.appendChild(el("div","hist-chip", st.ejercicios+" ejercicios"));
      chips.appendChild(el("div","hist-chip", st.series+" series"));
      if(st.vol>0) chips.appendChild(el("div","hist-chip strong", st.vol+" kg"));
      if(s.registro && s.registro.esfuerzo){
        chips.appendChild(el("div","hist-chip sint-"+sintClass(s.registro.esfuerzo), "Esfuerzo: "+sintLabel(REG_ESFUERZO, s.registro.esfuerzo).toLowerCase()));
      }
      if(s.registro && (s.registro.molestias==="leve" || s.registro.molestias==="si")){
        chips.appendChild(el("div","hist-chip sint-"+sintClass(s.registro.molestias), "Molestias: "+sintLabel(REG_MOLESTIAS, s.registro.molestias).toLowerCase()));
      }
      card.appendChild(chips);

      const nombres = (s.ejercicios||[])
        .filter(e=>e.series.some(x=>x.done))
        .map(e=> (DB.exercises[e.exId] && DB.exercises[e.exId].nombre) || "Ejercicio eliminado");
      if(nombres.length){
        card.appendChild(el("div","hist-card-list", nombres.join(" · ")));
      }
      card.onclick = ()=>{ VIEW={screen:"historyDay", sessionId:s.id}; render(); };
      wrap.appendChild(card);
    });
  });

  const restantes = DB.sessions.length - visibles;
  if(restantes > 0){
    const more = el("div","add-ex-btn","Ver "+Math.min(restantes, HISTORY_PAGE)+" entrenamientos más ("+restantes+" restantes)");
    more.onclick = ()=>{ HISTORY_LIMIT += HISTORY_PAGE; render(); };
    wrap.appendChild(more);
  }
  return wrap;
}

/* ---------- CRONÓMETRO INTELIGENTE DE DESCANSO ---------- */
let REST_TIMER = {active:false, endTime:null, duration:0, label:"", interval:null};

function playBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
    osc.onended = ()=> ctx.close();
  }catch(e){ /* audio no disponible */ }
}

function startRestTimer(seconds, label){
  REST_TIMER.active = true;
  REST_TIMER.duration = seconds;
  REST_TIMER.endTime = Date.now() + seconds*1000;
  REST_TIMER.label = label || "Descanso";
  if(REST_TIMER.interval) clearInterval(REST_TIMER.interval);
  REST_TIMER.interval = setInterval(tickRestTimer, 250);
  renderRestTimer();
}
function tickRestTimer(){
  if(!REST_TIMER.active) return;
  const remaining = Math.round((REST_TIMER.endTime - Date.now())/1000);
  if(remaining<=0){
    clearInterval(REST_TIMER.interval);
    REST_TIMER.interval = null;
    REST_TIMER.active = false;
    playBeep();
    if(navigator.vibrate) navigator.vibrate([300,100,300]);
    toast("¡Descanso terminado!");
    renderRestTimer();
    return;
  }
  // Solo repintamos el número, no toda la barra: mucho más ligero cada 250 ms.
  const timeEl = document.querySelector(".rest-bar-time");
  if(timeEl){
    const mm = String(Math.floor(remaining/60)).padStart(2,"0");
    const ss = String(remaining%60).padStart(2,"0");
    const txt = mm+":"+ss;
    if(timeEl.textContent !== txt) timeEl.textContent = txt;
  } else {
    renderRestTimer();
  }
}
function adjustRestTimer(deltaSeconds){
  if(!REST_TIMER.active) return;
  REST_TIMER.endTime += deltaSeconds*1000;
  tickRestTimer();
}
function skipRestTimer(){
  if(REST_TIMER.interval){ clearInterval(REST_TIMER.interval); REST_TIMER.interval = null; }
  REST_TIMER.active = false;
  renderRestTimer();
}
// Al volver a la pestaña/desbloquear, recalculamos desde el timestamp real (el intervalo
// puede haberse pausado en segundo plano, pero el tiempo restante se autocorrige).
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tickRestTimer(); });

function renderRestTimer(){
  const root = document.getElementById("rest-timer-root");
  if(!root) return;
  root.innerHTML = "";
  document.body.classList.toggle("resting", REST_TIMER.active);
  if(!REST_TIMER.active) return;
  const remaining = Math.max(0, Math.round((REST_TIMER.endTime - Date.now())/1000));
  const mm = String(Math.floor(remaining/60)).padStart(2,"0");
  const ss = String(remaining%60).padStart(2,"0");
  const bar = el("div","rest-bar");
  const info = el("div");
  info.appendChild(el("div","rest-bar-label", "⏳ "+REST_TIMER.label));
  info.appendChild(el("div","rest-bar-time", mm+":"+ss));
  bar.appendChild(info);
  const btns = el("div","rest-bar-btns");
  const minus = el("div","rest-bar-btn","-15s");
  minus.onclick = ()=> adjustRestTimer(-15);
  const plus = el("div","rest-bar-btn","+15s");
  plus.onclick = ()=> adjustRestTimer(15);
  const skip = el("div","rest-bar-btn","✕");
  skip.onclick = ()=> skipRestTimer();
  btns.appendChild(minus); btns.appendChild(plus); btns.appendChild(skip);
  bar.appendChild(btns);
  root.appendChild(bar);
}

function showNextExerciseModal(currentDef){
  if(!ACTIVE_SESSION) return;
  const routine = DB.routines[ACTIVE_SESSION.routineId];
  if(!routine) return;
  const others = routine.ejercicios.filter(id=>id!==currentDef.id).map(id=>effDef(id, routine.id)).filter(Boolean);
  const overlay = el("div","modal-overlay");
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(overlay); };
  const box = el("div","modal-box");
  box.appendChild(uaBanner());
  box.appendChild(el("div","modal-title","¿Siguiente ejercicio?"));
  box.appendChild(el("div","modal-msg","Elige el siguiente ejercicio y calculo el descanso adecuado."));
  others.forEach(nextDef=>{
    const row = el("div","modal-list-item", nextDef.nombre);
    row.onclick = ()=>{
      closeModal(overlay);
      const nextCat = categoryOf(nextDef);
      let secs;
      if(currentDef.calentamiento) secs = 0;               // tras calentar se empieza sin esperar
      else if(nextDef.restSeg!=null) secs = nextDef.restSeg; // pauta con descanso fijo
      else if(nextCat==="POT" || nextCat==="FUE") secs = 120;
      else if(["COR","EST","MOV"].includes(nextCat)) secs = 60;
      else if(["HIP","COND"].includes(nextCat)) secs = (bodyPartOf(currentDef)===bodyPartOf(nextDef)) ? 120 : 90;
      else secs = REST_DICT[nextCat] || 90;
      if(secs>0) startRestTimer(secs, "Antes de "+nextDef.nombre);
      VIEW = {screen:"exercise", exId:nextDef.id};
      render();
    };
    box.appendChild(row);
  });
  const btns = el("div","modal-btns");
  const cancel = el("div","modal-btn modal-btn-cancel","Cerrar sin descanso");
  cancel.onclick = ()=> closeModal(overlay);
  btns.appendChild(cancel);
  box.appendChild(btns);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

let _uaLast = -1, _panicLast = -1, _gatoLast = -1;
function pickDistinct(len, last){
  if(len<=1) return 0;
  let i; do{ i = Math.floor(Math.random()*len); }while(i===last);
  return i;
}
function uaPhrase(){ _uaLast = pickDistinct(UA_FRASES.length, _uaLast); return UA_FRASES[_uaLast]; }
function uaBanner(){
  const [uk, es] = uaPhrase();
  const b = el("div","ua-banner");
  const t = el("div","ua-text"); t.lang = "uk"; t.textContent = uk;
  b.appendChild(t);
  b.appendChild(el("div","ua-trad", es));
  return b;
}
// Prueba cada fuente en orden (archivo local, copia en la nube) y, si ninguna carga, un emoji.
function gatoImg(srcs, cls){
  const lista = [].concat(srcs).filter(Boolean);
  const img = document.createElement("img");
  img.alt = ""; img.className = cls;
  let i = 0;
  img.onerror = ()=>{
    i++;
    if(i < lista.length) img.src = lista[i];
    else img.replaceWith(el("div", cls+" gato-fallback", "🐱"));
  };
  img.src = lista[0];
  return img;
}
function remainingExercises(){
  if(!ACTIVE_SESSION) return 0;
  const routine = DB.routines[ACTIVE_SESSION.routineId];
  const ids = routine ? routine.ejercicios : [];
  return ids.filter(id=> !isExerciseDoneInSession(id)).length;
}
function panicPhrase(g){
  const n = remainingExercises();
  const propias = PANICO_FRASES[g.frases] || [];
  // El dúo habla en plural: solo usa sus frases. Cada gato mezcla las suyas con las comunes.
  const base = g.frases==="duo" ? propias : propias.concat(PANICO_FRASES.comun);
  const pool = base.filter(f=> n>0 || f.indexOf("{n}")<0);
  _panicLast = pickDistinct(pool.length, _panicLast);
  return pool[_panicLast % pool.length].replace(/\{n\}/g, n).replace(/\{ej\}/g, n===1 ? "ejercicio" : "ejercicios");
}
function showPanicModal(){
  const overlay = el("div","modal-overlay panic-overlay");
  const box = el("div","modal-box panic-box");
  const imgWrap = el("div","panic-img-wrap");
  const bubble = el("div","panic-bubble");
  const firma = el("div","panic-firma");
  const pintar = ()=>{
    // Primero quién habla (Zorro, Sanji o los dos, a partes iguales) y luego una de sus imágenes.
    const quienes = Array.from(new Set(GATOS.map(x=>x.nombre)));
    const prev = _gatoLast>=0 ? GATOS[_gatoLast].nombre : null;
    const quien = quienes[pickDistinct(quienes.length, quienes.indexOf(prev))];
    const suyas = GATOS.map((x,i)=>[x,i]).filter(([x])=> x.nombre===quien);
    const g = suyas[Math.floor(Math.random()*suyas.length)][0];
    _gatoLast = GATOS.indexOf(g);
    imgWrap.innerHTML = "";
    imgWrap.appendChild(gatoImg(g.img, "panic-img"));
    bubble.textContent = panicPhrase(g);
    firma.textContent = g.nombre ? "— "+g.nombre : "";
  };
  pintar();
  box.appendChild(imgWrap);
  box.appendChild(bubble);
  box.appendChild(firma);
  const btns = el("div","modal-btns");
  const otra = el("div","modal-btn modal-btn-cancel","Otro michi");

  btns.appendChild(otra); btns.appendChild(ok);
  box.appendChild(btns);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

/* ---------- Init ---------- */
async function init(){
  document.getElementById("app").innerHTML = "<div style='padding:60px 20px;text-align:center;color:var(--muted);font-size:15px;'>Cargando GymLog…</div>";
  try{
    DB = await loadDB();
    await saveNow(); // consolida la migración/reconciliación en disco de una vez
  }catch(e){
    console.error(e);
    document.getElementById("app").innerHTML = "<div style='padding:60px 20px;text-align:center;color:var(--danger);font-size:15px;'>No se pudieron cargar los datos. Recarga la página.</div>";
    return;
  }
  render();
  if(!Storage.persistent){
    toast("Aviso: este navegador no permite guardar datos");
  }
}
init();

/* ---------- PWA: registro del service worker y actualizaciones ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      // Si hay una versión nueva esperando, avisamos en vez de aplicarla
      // a mitad de un entrenamiento sin avisar.
      function notifyUpdate(worker){
        const bar = document.createElement("div");
        bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:16px;z-index:400;"+
          "background:#1F3A5F;color:#fff;border-radius:12px;padding:13px 16px;display:flex;"+
          "align-items:center;gap:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);";
        bar.innerHTML = "<span style='flex:1'>Hay una versión nueva de GymLog</span>";
        const btn = document.createElement("button");
        btn.textContent = "Actualizar";
        btn.style.cssText = "background:#fff;color:#1F3A5F;border-radius:9px;padding:8px 14px;font-weight:700;font-size:13.5px;";
        btn.onclick = ()=>{ worker.postMessage("SKIP_WAITING"); bar.remove(); };
        const later = document.createElement("button");
        later.textContent = "Luego";
        later.style.cssText = "color:#cbd5e1;font-size:13px;";
        later.onclick = ()=> bar.remove();
        bar.appendChild(btn); bar.appendChild(later);
        document.body.appendChild(bar);
      }
      if(reg.waiting) notifyUpdate(reg.waiting);
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          if(nw.state === "installed" && navigator.serviceWorker.controller) notifyUpdate(nw);
        });
      });
      // Comprueba si hay actualizaciones cada vez que vuelves a la app.
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reg.update(); });
    }).catch(err=> console.warn("SW no registrado:", err));

    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
