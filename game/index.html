<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5d">
<title>Constant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --fondo:#f6f1e7; --superficie:#fffdf8; --superficie-2:#f0e9db;
  --linea:#e0d6c3; --texto:#2c2a26; --suave:#6f6857;
  --acento:#2f7d5d; --acento-claro:#e4f0e9;
  --oro:#c98a2b; --alerta:#b24a3c; --sombra:0 1px 2px rgba(60,50,30,.06),0 4px 16px rgba(60,50,30,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --fondo:#17181a; --superficie:#212326; --superficie-2:#2a2d31;
    --linea:#35393e; --texto:#eceae5; --suave:#a09a8e;
    --acento:#5fb98d; --acento-claro:#1e3a2e;
    --oro:#e0a94b; --alerta:#e07d6c; --sombra:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--fondo);color:var(--texto);
  font:16px/1.5 ui-rounded,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:23px}
h2{font-size:17px}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}

.contenido{max-width:620px;margin:0 auto;padding:16px 16px 24px}
header.barra{
  position:sticky;top:0;z-index:5;background:var(--fondo);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--linea);
}
header.barra .interior{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.fecha{color:var(--suave);font-size:13px}

.tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);padding:16px;box-shadow:var(--sombra);margin-bottom:12px}
.tarjeta.plana{box-shadow:none}
.titulo-seccion{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:20px 0 8px;font-weight:650}

.nivel-fila{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.nivel-num{font-size:30px;font-weight:700;letter-spacing:-.02em}
.barra-xp{height:10px;background:var(--superficie-2);border-radius:99px;overflow:hidden}
.barra-xp > i{display:block;height:100%;background:linear-gradient(90deg,var(--acento),var(--oro));border-radius:99px;transition:width .4s ease}

.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dato{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);padding:14px;box-shadow:var(--sombra)}
.dato .k{font-size:12px;color:var(--suave);margin-bottom:2px}
.dato .v{font-size:21px;font-weight:680;letter-spacing:-.01em}
.dato .n{font-size:12px;color:var(--suave);margin-top:2px}

.pastilla{display:inline-flex;align-items:center;gap:6px;background:var(--superficie-2);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.pastilla.viva{background:var(--acento-claro);color:var(--acento)}
.pastilla.rota{background:transparent;color:var(--suave);border:1px solid var(--linea)}

/* Cabecera de una tarjeta de ejercicio, en las dos caras. El hueco de la derecha es para
   el doblés: sin él, la etiqueta de importancia queda debajo de la esquina doblada. */
.cara .cab{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:9px;padding-right:34px;
}
.cara .nom{font-weight:600}
.etiqueta{font-size:11px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.estados{display:flex;gap:6px;flex-wrap:wrap}
.estados button{
  flex:1;min-width:48px;padding:8px 3px;border-radius:10px;background:var(--superficie-2);
  font-size:11.5px;font-weight:600;color:var(--suave);transition:.15s;border:1px solid transparent;
  white-space:nowrap;
}
.estados button[aria-pressed="true"]{background:var(--acento);color:#fff;border-color:var(--acento)}
.estados button.malo[aria-pressed="true"]{background:var(--alerta);border-color:var(--alerta)}
.estados button.medio[aria-pressed="true"]{background:var(--oro);border-color:var(--oro)}

.comida{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--linea)}
.comida:last-of-type{border-bottom:none}
.comida .txt{flex:1;min-width:0}
.comida .txt b{display:block;font-weight:600;font-size:15px}
.comida .txt small{color:var(--suave)}
.punto{width:9px;height:9px;border-radius:99px;flex:none}
.punto.ok{background:var(--acento)} .punto.leve{background:var(--oro)}
.punto.no{background:var(--alerta)} .punto.exenta{background:var(--suave);opacity:.5}

.boton{
  display:block;width:100%;padding:13px;border-radius:12px;background:var(--acento);color:#fff;
  font-weight:650;text-align:center;transition:.15s
}
.boton:active{transform:scale(.99)}
.boton.secundario{background:var(--superficie-2);color:var(--texto)}
.boton.fino{padding:9px;font-size:14px}
.boton[disabled]{opacity:.45;pointer-events:none}

/* Una serie del día: número, peso, repeticiones y la marca de hecha. Las columnas son fijas
   y estrechas porque son dos números; con 1fr los campos no bajaban de su ancho intrínseco
   y la fila se salía de la tarjeta. */
.serie{
  display:grid;grid-template-columns:20px 68px 60px 36px;gap:7px;
  align-items:center;justify-content:start;margin-bottom:6px;
}
.serie .idx{font-size:11px;font-weight:700;color:var(--suave)}
.serie input{
  width:100%;min-width:0;padding:7px 6px;border:1px solid var(--linea);border-radius:9px;
  background:var(--superficie-2);color:var(--texto);font-size:15px;text-align:center;
}
.serie .check{
  height:33px;border:1px solid var(--linea);border-radius:9px;
  background:var(--superficie-2);color:#fff;font-size:16px;font-weight:700;
}
.serie .check.hecha{background:var(--acento);border-color:var(--acento)}
.ejercicio.listo .cab .nom{color:var(--acento)}

/* La tarjeta de ejercicio gira sobre su eje para enseñar las notas del ejercicio.
   Las dos caras comparten la misma celda de rejilla, así que la altura la marca la más
   alta y no hace falta fijarla a mano. */
.volteable{
  display:grid;perspective:1100px;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.7,.3,1);margin-bottom:12px;
}
.volteable[data-volteada="true"]{transform:rotateY(180deg)}
.volteable > .cara{grid-area:1/1;backface-visibility:hidden;margin:0}
.volteable > .dorso{transform:rotateY(180deg)}
.volteable[data-volteada="true"] > .cara:not(.dorso){pointer-events:none}
.volteable[data-volteada="false"] > .dorso{pointer-events:none}
.volteable .info{font-size:14px;line-height:1.5;white-space:pre-wrap;margin:0}

/* El doblés: la esquina doblada que gira la tarjeta. El triángulo es la parte levantada
   y la sombra de debajo es lo que hace que se lea como un papel doblado. */
.dobles{
  position:absolute;top:0;right:0;width:30px;height:30px;border-top-right-radius:var(--r);
  background:linear-gradient(225deg,var(--superficie-2) 0 50%,transparent 50%);
  filter:drop-shadow(-1px 1px 1px rgba(0,0,0,.18));
}
.dobles::before{
  content:'';position:absolute;inset:0;border-top-right-radius:var(--r);
  background:linear-gradient(225deg,transparent 0 calc(50% - 1px),var(--linea) calc(50% - 1px) 50%,transparent 50%);
}
.dobles::after{
  content:'⤺';position:absolute;top:1px;right:4px;font-size:13px;color:var(--suave);line-height:1;
}
.cara{position:relative}

/* Ficha de un ejercicio dentro del editor de rutina. */
.def{padding:11px 0;border-bottom:1px solid var(--linea)}
.def:last-of-type{border-bottom:none}
.def .nom{font-weight:600}
.def .campos{display:grid;grid-template-columns:1fr 60px 1fr;gap:8px;align-items:end}
.def .campos span{display:block;font-size:11px;color:var(--suave);margin-bottom:4px}
.def textarea{
  width:100%;min-height:52px;padding:8px;border:1px solid var(--linea);border-radius:9px;
  background:var(--superficie-2);color:var(--texto);font-size:14px;resize:vertical;
}
.def .campos input,.def .campos select{
  width:100%;padding:8px;border:1px solid var(--linea);border-radius:9px;
  background:var(--superficie-2);color:var(--texto);font-size:14px;
}
.titulo-editable{
  flex:1;border:none;background:transparent;color:var(--texto);font-size:17px;font-weight:700;padding:0;
}

/* Una comida del plan del día, con sus tres botones de cumplimiento. */
.comida-plan.exenta{opacity:.6}
.comida-plan .estados button{flex:1}

/* Recuadros para elegir la sesión del día: una rutina, descanso o actividad de fuera. */
.opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.opciones .opcion{
  display:grid;gap:3px;text-align:left;padding:12px;border-radius:14px;
  background:var(--superficie);border:1px solid var(--linea);box-shadow:var(--sombra);
}
.opciones .opcion b{font-size:15px}
.opciones .opcion .mini{font-size:12px}
.opciones .opcion.suave{background:var(--superficie-2);box-shadow:none}
.opciones .opcion[aria-pressed="true"]{
  border-color:var(--acento);background:var(--acento);color:#fff;
}
.opciones .opcion[aria-pressed="true"] .mini{color:#fff;opacity:.8}
.opciones .opcion[disabled]{opacity:.5}

.enlace{color:var(--acento);font-weight:600;text-decoration:underline;font-size:inherit}

.dias{display:flex;gap:6px}
.dias button{
  flex:1;aspect-ratio:1;border-radius:11px;background:var(--superficie-2);font-size:13px;font-weight:650;color:var(--suave)
}
.dias button[aria-pressed="true"]{background:var(--acento);color:#fff}

.tira{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.tira .celda{aspect-ratio:1;border-radius:8px;background:var(--superficie-2);display:grid;place-items:center;font-size:11px;color:var(--suave);font-weight:600}
.tira .celda.cumplido{background:var(--acento);color:#fff}
.tira .celda.fallado{background:var(--alerta);color:#fff;opacity:.8}
.tira .celda.no_exigido{background:var(--superficie-2);color:var(--suave)}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;
  background:var(--superficie);border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{flex:1;padding:10px 2px 8px;font-size:10px;font-weight:600;color:var(--suave);display:grid;gap:3px;justify-items:center}
.nav button[aria-current="page"]{color:var(--acento)}
.nav .ic{font-size:18px;line-height:1}


.catalogo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.articulo{background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:9px;box-shadow:var(--sombra)}
.articulo .nom{font-size:12px;font-weight:600;margin-top:7px;line-height:1.25}
.articulo .precio{font-size:12px;color:var(--suave);margin-top:2px}
.articulo[aria-disabled="true"]{opacity:.5}
.articulo button{width:100%;margin-top:7px;padding:6px;border-radius:9px;background:var(--acento);color:#fff;font-size:12px;font-weight:650}
.articulo button.gris{background:var(--superficie-2);color:var(--texto)}
.articulo button[disabled]{opacity:.5;pointer-events:none}

.vida{height:9px;border-radius:99px;background:var(--superficie-2);overflow:hidden;margin-top:5px}
.vida > i{display:block;height:100%;background:var(--acento);transition:width .35s ease}
.vida.enemiga > i{background:var(--alerta)}
.combate{display:grid;gap:12px}
.luchador{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.diario{background:var(--superficie-2);border-radius:12px;padding:11px;font-size:13px;display:grid;gap:4px;max-height:118px;overflow-y:auto}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Escena de combate: el héroe de espaldas abajo a la izquierda, el rival de frente
   arriba a la derecha, los dos mirando hacia dentro. */
.escena{
  position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--linea);background:linear-gradient(#cfe0d8 0%,#e8e0cd 62%,#d4c5a6 100%);
  background-size:cover;background-position:center
}
.escena > .telon{position:absolute;inset:0;background-size:cover;background-position:center}
/* La altura manda y el ancho sale de la proporción: así el de delante se ve claramente
   más grande que el del fondo sin descuadrar la escena. Las posiciones dejan los pies de
   cada uno sobre el suelo del fondo, que empieza hacia la mitad de la imagen. */
.combatiente{position:absolute;display:flex}
.combatiente.rival{right:9%;top:26%;height:44%}
.combatiente.heroe{left:1%;bottom:1%;height:74%}

/* La proporción tiene que ser la de UNA pose de la hoja (ANCHO_POSE/ALTO_POSE en
   tools/preparar.py). Si no coincide, el recorte deja asomar a la pose de al lado. */
.figura{position:relative;flex:1;min-height:0;aspect-ratio:1/2;overflow:hidden;display:grid;place-items:center}
.figura > b{
  font-size:13px;font-weight:700;color:hsl(var(--tono) 45% 32%);
  background:hsl(var(--tono) 45% 88%);border-radius:10px;padding:14px 10px
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]) .figura > b{background:hsl(var(--tono) 25% 26%);color:hsl(var(--tono) 45% 78%)}
}
.figura > img{position:absolute;left:0;top:0;height:100%;width:auto;max-width:none}
.figura.ficha{flex:none;height:118px}
.figura.retrato{width:100%;flex:none}
.figura.objeto{width:100%;aspect-ratio:1;flex:none}
.figura.objeto > img{height:100%;width:100%;object-fit:contain}
.figura.golpeado{animation:sacudida .38s}
.figura.golpeado::after{content:"";position:absolute;inset:0;background:var(--alerta);opacity:.32;mix-blend-mode:multiply}
@keyframes sacudida{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  60%{transform:translateX(5px)}
}

.placa{position:absolute;width:54%;background:color-mix(in srgb,var(--superficie) 90%,transparent);
  border:1px solid var(--linea);border-radius:11px;padding:6px 9px;backdrop-filter:blur(3px)}
.placa-rival{left:4%;top:5%}
.placa-heroe{right:4%;bottom:5%}
.placa b{font-size:12.5px;display:block;line-height:1.3}
.placa .mini{font-size:11px}
/* La parcela es una escena, no una cuadrícula. Cada objeto se ancla por su base al punto
   del suelo que le toca y se escala con la profundidad: lo que está más atrás se ve más
   pequeño. Con la rejilla anterior todo medía igual y quedaba flotando. */
.escenario{
  position:relative;aspect-ratio:4/3;min-height:300px;
  margin-bottom:12px;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--linea);background:var(--superficie-2) center/cover
}
.escenario > button{
  position:absolute;padding:0;
  /* El ancla es la base, no el centro: por eso -100% en vertical. */
  transform:translate(-50%,-100%) scale(var(--escala));
  transform-origin:bottom center;
}
.hueco{
  width:34px;height:34px;border-radius:10px;
  border:1px dashed color-mix(in srgb,#fff 50%,transparent);
  background:color-mix(in srgb,#000 14%,transparent);opacity:.55;
  /* Siempre por encima de lo colocado: si no, un mueble del primer plano dejaría sin tocar
     el hueco libre que tiene detrás. Como son solo un recuadro tenue, no molestan. */
  z-index:200 !important;
}
.hueco.pared{border-radius:6px;height:28px}
.hueco.suelo{height:20px;width:72px;border-radius:99px}
.hueco.activo,.puesto.activo{opacity:1;outline:2px solid var(--acento);outline-offset:3px;border-radius:12px}
.puesto{width:78px;background:none;border:none}
.puesto .objeto{width:100%;height:auto;display:block}

.pestanas{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.pestanas button{padding:7px 13px;border-radius:99px;background:var(--superficie-2);font-size:13px;font-weight:600;white-space:nowrap;color:var(--suave)}
.pestanas button[aria-pressed="true"]{background:var(--acento);color:#fff}

.vacio{text-align:center;color:var(--suave);padding:28px 16px;font-size:14px}
.aviso{background:var(--acento-claro);color:var(--acento);border-radius:12px;padding:11px 13px;font-size:13.5px;font-weight:550;margin-bottom:12px}
.aviso.ojo{background:color-mix(in srgb,var(--oro) 15%,transparent);color:var(--oro)}
label.campo{display:block;margin-bottom:12px}
label.campo span{display:block;font-size:13px;color:var(--suave);margin-bottom:5px}
input[type=text],input[type=date],textarea,select{
  width:100%;padding:11px;border-radius:11px;border:1px solid var(--linea);
  background:var(--superficie-2);color:var(--texto);font:inherit
}
textarea{min-height:70px;resize:vertical}
.fila{display:flex;gap:8px;align-items:center}
.fila > *{flex:1;min-width:0}
.fila .boton{width:auto}
.entre{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini{font-size:13px;color:var(--suave)}
</style>
</head>
<body>
<header class="barra">
  <div class="interior">
    <div>
      <h1 id="tituloVista">Hoy</h1>
      <div class="fecha" id="subtitulo"></div>
    </div>
    <div class="pastilla" id="saldo">0</div>
  </div>
</header>

<main class="contenido" id="vista"></main>

<nav class="nav" id="nav">
  <button data-vista="inicio" aria-current="page"><span class="ic">🏠</span>Hoy</button>
  <button data-vista="entreno"><span class="ic">🏋️</span>Entreno</button>
  <button data-vista="dieta"><span class="ic">🥗</span>Dieta</button>
  <button data-vista="personaje"><span class="ic">🗡️</span>Héroe</button>
  <button data-vista="mundo"><span class="ic">🏛️</span>Mundo</button>
  <button data-vista="ajustes"><span class="ic">⚙️</span>Ajustes</button>
</nav>

<script type="module" src="src/ui/app.js"></script>
</body>
</html>
